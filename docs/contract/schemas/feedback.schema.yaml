# Feedback Artifact Schema
# Structured feedback for validation failure → re-invocation loop

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [error_context, attempt_number, max_attempts]
properties:
  error_context:
    type: string
    description: "What went wrong in the previous attempt"
  
  corrections:
    type: array
    items:
      type: string
    description: "Specific suggestions for correction"
  
  suggested_strategy:
    type: string
    enum: [retry_same, retry_different_agent, apply_corrections, human_intervention]
    description: "Recommended next action"
  
  previous_raw_output:
    type: string
    description: "Agent's raw output for context"
  
  previous_artifact:
    type: object
    description: "Previous attempt's artifact (if any)"
  
  validation_errors:
    type: array
    items:
      type: object
      required: [category, code, message]
      properties:
        category:
          type: string
          enum: [structural, semantic, policy, quality]
        code:
          type: string
          description: "Machine-readable error code"
        message:
          type: string
          description: "Human-readable error description"
        path:
          type: string
          description: "JSON path to offending field"
        severity:
          type: string
          enum: [error, warning, info]
  
  attempt_number:
    type: integer
    minimum: 1
    description: "Current retry attempt (1-indexed)"
  
  max_attempts:
    type: integer
    minimum: 1
    description: "Maximum allowed attempts"
  
  feedback_strategy:
    type: string
    enum: [structural_hint, semantic_hint, strategy_change, agent_change]
    description: "Type of feedback to inject"
  
  parser_strategy_suggestion:
    type: string
    enum: [structured_output, tool_call_interception, markdown_block, workspace_observation, llm_coercion]
    description: "Suggested parser strategy for next attempt"
