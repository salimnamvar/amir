# ValidationResult Contract Schema
# Structured structural + semantic validation outcome for artifacts and sessions

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [validation_id, target_type, target_id, valid, validators, error_categories]
properties:
  validation_id:
    type: string
    format: uuid
    description: "Unique validation run identifier"

  target_type:
    type: string
    enum: [artifact, agent_session, compiled_prompt, workspace_observation]
    description: "What was validated"

  target_id:
    type: string
    format: uuid
    description: "ID of the validated entity"

  session_id:
    type: string
    format: uuid
    description: "AgentSession that produced the target (if applicable)"

  task_id:
    type: string
    format: uuid

  valid:
    type: boolean
    description: "True only when all required validators pass with no error-severity findings"

  validators:
    type: array
    minItems: 1
    items:
      type: object
      required: [validator_id, validator_type, status]
      properties:
        validator_id:
          type: string
          description: "Registered validator identifier"
        validator_type:
          type: string
          enum: [structural, semantic, policy, quality, behavioral, test_execution]
        status:
          type: string
          enum: [pass, fail, warn, skipped, timed_out, budget_exceeded]
        score:
          type: number
          minimum: 0
          maximum: 1
        evidence_uri:
          type: string
          description: "URI to validator evidence (logs, reports, diffs)"
        duration_ms:
          type: integer
          minimum: 0
        budget_usd:
          type: number
          minimum: 0
          description: "Budget allocated to this validator run"

  error_categories:
    type: array
    items:
      type: object
      required: [category, code, message]
      properties:
        category:
          type: string
          enum: [structural, semantic, policy, quality]
        code:
          type: string
          description: "Machine-readable error code (e.g., SCHEMA_REQUIRED_FIELD)"
        message:
          type: string
        path:
          type: string
          description: "JSON path to offending field"
        severity:
          type: string
          enum: [error, warning, info]
          default: error

  warnings:
    type: array
    items:
      type: string

  # Reconciliation between parser claims and workspace observation
  claim_reconciliation:
    type: object
    description: "Comparison of agent/parser claims against workspace ground truth"
    properties:
      observation_method:
        type: string
        enum: [workspace_diff, parser_extracted, agent_claims, synthesized]
      claims_match_observation:
        type: boolean
        description: "True when agent/parser claims are consistent with workspace state"
      claimed_paths:
        type: array
        items:
          type: string
      observed_paths:
        type: array
        items:
          type: string
      missing_from_claims:
        type: array
        items:
          type: string
        description: "Paths changed in workspace but absent from agent claims"
      missing_from_observation:
        type: array
        items:
          type: string
        description: "Paths claimed by agent but not present in workspace diff"
      divergence_summary:
        type: string

  validation_duration_ms:
    type: integer
    minimum: 0

  started_at:
    type: string
    format: date-time

  completed_at:
    type: string
    format: date-time
