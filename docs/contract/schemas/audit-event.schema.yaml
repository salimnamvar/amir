# Audit-Event Contract Schema
# Complete schema for audit events

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [event_id, timestamp, level, component, event_type]
properties:
  # Event identity
  event_id:
    type: string
    format: uuid
    description: "Unique event identifier"
  
  timestamp:
    type: string
    format: date-time
    description: "Event occurrence time"
  
  # Event metadata
  level:
    type: string
    enum: [info, warning, error, critical]
    description: "Event severity level"
  
  component:
    type: string
    description: "Source component emitting event"
  
  event_type:
    type: string
    description: "Specific event type (e.g., Task.Created, Agent.Invoked)"
  
  # Correlation
  correlation_id:
    type: string
    format: uuid
    description: "Correlation for trace tracking"
  
  causation_id:
    type: string
    format: uuid
    description: "Cause of this event"
  
  # Payload
  payload:
    type: object
    description: "Event-specific data"
  
  # Security
  signature:
    type: string
    description: "Cryptographic signature for tamper detection"