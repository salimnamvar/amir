# Agent Contract Schema
# Machine-readable contract for agent registration and invocation

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [name, adapter_type, adapter_config]
properties:
  # Core Identity
  name:
    type: string
    description: "Unique agent name (lowercase, no spaces)"
    pattern: "^[a-z0-9-]+$"
    maxLength: 100
  
  description:
    type: string
    description: "Human-readable description of agent capabilities"
  
  version:
    type: string
    description: "Agent version (SemVer format)"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  
  # Adapter Configuration (strict)
  adapter_type:
    type: string
    enum: [cli, mcp, api, remote]
    description: "How to communicate with this agent"
  
  adapter_config:
    type: object
    required: [binary_path]
    properties:
      binary_path:
        type: string
        description: "Path to CLI binary (REQUIRED for cli type)"
      working_directory:
        type: string
        description: "Working directory for execution"
      endpoint:
        type: string
        description: "API endpoint URL (REQUIRED for api type)"
        pattern: "^https?://"
      protocol:
        type: string
        enum: [http, grpc, jsonrpc]
        default: "http"
  
  # Capabilities (for routing)
  capabilities:
    type: array
    items:
      $ref: "capability.schema.yaml"
    description: "Skills and tools this agent can perform"
  
  # Resource Limits
  resource_limits:
    type: object
    properties:
      max_context_tokens:
        type: integer
        minimum: 1
        default: 100000
      max_output_tokens:
        type: integer
        minimum: 1
        default: 4000
      timeout_seconds:
        type: integer
        minimum: 1
        default: 3600
  
  # Security Profile
  security_profile:
    type: object
    properties:
      sandbox_required:
        type: boolean
        default: true
      network_access:
        type: string
        enum: [none, limited, full]
        default: "limited"
  
  # Runtime Contract Support
  supported_contracts:
    type: array
    items:
      type: object
      required: [type, version]
      properties:
        type:
          type: string
          description: "Contract type this agent supports"
        version:
          type: string
          description: "Minimum version required"
        max_version:
          type: string