# Agent Contract Schema
# Machine-readable contract for agent registration and invocation

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [name, adapter_type, adapter_config]
properties:
  # Core Identity
  name:
    type: string
    description: "Unique agent name (lowercase, no spaces)"
    pattern: "^[a-z0-9-]+$"
    maxLength: 100
  
  description:
    type: string
    description: "Human-readable description of agent capabilities"
  
  version:
    type: string
    description: "Agent version (SemVer format)"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  
  # Adapter Configuration (strict)
  adapter_type:
    type: string
    enum: [cli, mcp, api, remote]
    description: "How to communicate with this agent"
  
  adapter_config:
    type: object
    required: [binary_path]
    properties:
      binary_path:
        type: string
        description: "Path to CLI binary (REQUIRED for cli type)"
      working_directory:
        type: string
        description: "Working directory for execution"
      endpoint:
        type: string
        description: "API endpoint URL (REQUIRED for api type)"
        pattern: "^https?://"
      protocol:
        type: string
        enum: [http, grpc, jsonrpc]
        default: "http"
  
  # Capabilities (for routing)
  capabilities:
    type: array
    items:
      $ref: "capability.schema.yaml"
    description: "Skills and tools this agent can perform"
  
  # Resource Limits
  resource_limits:
    type: object
    properties:
      max_context_tokens:
        type: integer
        minimum: 1
        default: 100000
      max_output_tokens:
        type: integer
        minimum: 1
        default: 4000
      timeout_seconds:
        type: integer
        minimum: 1
        default: 3600
  
  # Security Profile
  # Maps to sandbox network_mode: none → none, proxy → proxy.
  # Unrestricted/host networking is not permitted.
  security_profile:
    type: object
    properties:
      sandbox_required:
        type: boolean
        default: true
      network_access:
        type: string
        enum: [none, proxy]
        default: "proxy"
        description: "none = no egress; proxy = all egress via Amir egress proxy"
      network_allowlist:
        type: array
        items:
          type: string
        description: >
          Default destinations permitted through the egress proxy when network_access=proxy.
          Empty array means deny-all except platform-injected LLM provider routes.
          Coding agents should include package registries they require (e.g. pypi.org, registry.npmjs.org).
      default_network_allowlist_profile:
        type: string
        enum: [llm_only, coding_standard, custom]
        default: coding_standard
        description: >
          coding_standard expands to LLM provider + common package registries;
          llm_only is provider endpoints only; custom uses network_allowlist as-is.
  # Supported output modes (control-plane extraction strategies)
  supported_output_modes:
    type: array
    items:
      type: string
      enum: [json_schema, tool_use, markdown_yaml, workspace_observation]
    minItems: 1
    default: [json_schema, workspace_observation]
    description: "Extraction modes this agent/adapter supports; free_text is not a control-plane mode"
  
  # Runtime Contract Support
  supported_contracts:
    type: array
    items:
      type: object
      required: [type, version]
      properties:
        type:
          type: string
          description: "Contract type this agent supports"
        version:
          type: string
          description: "Minimum version required"
        max_version:
          type: string