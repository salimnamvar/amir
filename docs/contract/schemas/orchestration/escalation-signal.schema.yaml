# EscalationSignal Contract Schema
# First-class escalation signal that can inject into AgentSession or WorkflowInstance

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required:
  - signal_id
  - target_type
  - target_id
  - escalation_type
  - idempotency_key
  - assigned_to
properties:
  signal_id:
    type: string
    format: uuid
    description: "Unique escalation identifier"

  idempotency_key:
    type: string
    description: "Idempotency key for escalation creation"

  target_type:
    type: string
    enum: [agent_session, workflow_instance]
    description: "What type of entity to escalate"

  target_id:
    type: string
    format: uuid
    description: "ID of the target entity"

  escalation_type:
    type: string
    enum:
      - compensation_blocked
      - cost_limit_exceeded
      - validation_failed
      - slo_breach
      - manual_trigger
      - circuit_breaker_open
    description: "Type of escalation trigger"

  reason:
    type: string
    description: "Human-readable reason for escalation"

  # Recipient (required for actionable escalations)
  assigned_to:
    type: string
    description: "Team or user ID expected to respond"

  notification_channel:
    type: string
    enum: [email, slack, pagerduty, webhook, in_app]
    description: "How to notify the assignee"

  response_deadline:
    type: string
    format: date-time
    description: "When a response is required by"

  remediation_plan:
    type: array
    items:
      type: string
    description: "Structured remediation steps (especially for compensation_blocked)"

  safe_abort_available:
    type: boolean
    default: true
    description: "Whether operator can choose safe abort without further compensation"

  triggered_at:
    type: string
    format: date-time
    description: "When escalation was triggered"

  acknowledged_at:
    type: string
    format: date-time
    description: "When human acknowledged (optional)"

  acknowledged_by:
    type: string
    description: "Who acknowledged the escalation (must be authorized principal)"

  acknowledged_by_role:
    type: string
    description: "Role of acknowledger (e.g. oncall, workflow_admin, security_admin)"

  # Who may acknowledge/resolve (authorization model)
  authorized_acknowledgers:
    type: array
    items:
      type: string
    description: >
      Principal or role IDs allowed to acknowledge/resolve. Default: assigned_to only.
      P1-ESCALATION-CONCURRENCY: Concurrent resolution uses first-writer-wins via
      resolution_revision. The second writer receives a revision mismatch error (409 Conflict)
      and must re-read the current state before attempting resolution again.

  resolution:
    type: string
    enum: [pending, resumed, aborted, compensated]
    default: "pending"
    description: "Current resolution state"

  resolution_timestamp:
    type: string
    format: date-time
    description: "When resolution was set (required when resolution != pending)"

  resolution_revision:
    type: integer
    minimum: 0
    default: 0
    description: "Optimistic concurrency token; increment on every resolution write"

  resolution_notes:
    type: string
    description: "Notes on how the escalation was resolved"

# When resolved, require timestamp and acknowledger
# P0-COMPENSATION-DEADLOCK: compensation_blocked always requires remediation_plan
allOf:
  - if:
      properties:
        resolution:
          enum: [resumed, aborted, compensated]
      required: [resolution]
    then:
      required: [resolution_timestamp, acknowledged_by]
  - if:
      properties:
        escalation_type:
          const: compensation_blocked
      required: [escalation_type]
    then:
      required: [remediation_plan]
      description: "Compensation blocked escalations MUST carry structured remediation steps"
