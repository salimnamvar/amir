# StepResult Contract Schema
# Ordered workflow step execution history entry

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [step_id, status, sequence]
properties:
  step_result_id:
    type: string
    format: uuid

  step_id:
    type: string

  task_id:
    type: string
    format: uuid

  session_id:
    type: string
    format: uuid

  status:
    type: string
    enum:
      - pending
      - running
      - succeeded
      - failed
      - compensated
      - compensation_blocked
      - skipped
    description: "compensation_blocked when concrete compensation fails and continue_on_compensation_failure=false"

  sequence:
    type: integer
    minimum: 0
    description: "Ordering key; step_results must be ordered by sequence"

  compensation:
    $ref: "compensation-action.schema.yaml"

  durable_effects_snapshot:
    type: object
    description: "Workspace.durable_effects captured at step completion (for compensation)"
    properties:
      branch_name:
        type: string
      head_commit:
        type: string
      pr_number:
        type: integer
      remote_url:
        type: string
        format: uri
      # P1-DURABLE-EFFECTS-SNAPSHOT: content-addressed snapshot for drift detection
      snapshot_captured_at:
        type: string
        format: date-time
        description: "When this snapshot was captured from Workspace.durable_effects"
      workspace_durable_effects_hash:
        type: string
        description: "SHA256 of Workspace.durable_effects at capture time; CI verifies hash matches canonical"

  started_at:
    type: string
    format: date-time

  completed_at:
    type: string
    format: date-time
