# Approval Contract Schema
# Complete schema for approval tracking

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [workflow_id, gate_name, status]
properties:
  # References
  workflow_id:
    type: string
    format: uuid
  
  gate_name:
    type: string
    description: "Name of approval gate"
  
  # Approval status
  status:
    type: string
    enum: [pending, auto_approved, granted, rejected, expired]
    default: "pending"
  
  # Timing
  requested_at:
    type: string
    format: date-time
  
  responded_at:
    type: string
    format: date-time
  
  # Approver info
  approver_id:
    type: string
    description: "Who approved (empty for auto-approved)"
  
  # Gate configuration
  auto_approve:
    type: boolean
    default: false
    description: "Whether this gate auto-approves; safe default requires explicit opt-in"
  
  timeout_seconds:
    type: integer
    minimum: 1
    default: 86400

  # Escalation chain for multi-approver / critical gates
  escalation:
    type: object
    description: "Optional approval escalation chain"
    properties:
      escalation_chain:
        type: array
        items:
          type: object
          properties:
            approver_id:
              type: string
            timeout_seconds:
              type: integer
              minimum: 1
            fallback:
              type: string
              enum: [next_approver, auto_approve, reject]
      quorum:
        type: integer
        minimum: 1
        description: "Required number of approvals"
      justification_required:
        type: boolean
        default: false

  context:
    type: object
    description: "What the approver sees (non-authoritative display payload)"