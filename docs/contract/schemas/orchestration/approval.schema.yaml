# Approval Contract Schema
# Complete schema for approval tracking
# auto_approve defaults to false (safe); cancelled status for workflow abort during pending.

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [workflow_id, gate_name, status, idempotency_key]
properties:
  approval_id:
    type: string
    format: uuid
    description: "Unique approval identifier"

  idempotency_key:
    type: string
    description: "Idempotency key for approval request / grant"

  # References
  workflow_id:
    type: string
    format: uuid
  
  gate_name:
    type: string
    description: "Name of approval gate"

  # Approval type (extends for coercion approvals)
  approval_type:
    type: string
    enum: [workflow_gate, coercion, manual]
    default: workflow_gate
    description: "workflow_gate = normal transition; coercion = llm_coercion synthesis; manual = operator"
  
  # Approval status
  status:
    type: string
    enum: [pending, auto_approved, granted, rejected, expired, cancelled]
    default: "pending"
    description: >
      pending → auto_approved (when auto_approve=true) or granted (human) or rejected
      or expired or cancelled (workflow aborted while waiting).
  
  # Timing
  requested_at:
    type: string
    format: date-time
  
  responded_at:
    type: string
    format: date-time
    description: "Required when status is granted, rejected, auto_approved, or cancelled"
  
  # Approver info
  approver_id:
    type: string
    description: "Who approved (empty for auto-approved)"

  approver_role:
    type: string
    description: "Role of approver (required for approval_type=coercion)"
  
  # Gate configuration
  auto_approve:
    type: boolean
    default: false
    description: "Whether this gate auto-approves; safe default requires explicit opt-in"
  
  timeout_seconds:
    type: integer
    minimum: 1
    default: 86400

  # TTL for granted coercion approvals
  expires_at:
    type: string
    format: date-time
    description: "When a granted approval expires (especially for coercion)"

  # Audit trail for coercion / multi-approver decisions
  audit_trail:
    type: array
    maxItems: 100
    description: "P2-APPROVAL-UNBOUNDED: Append-only audit entries (required for approval_type=coercion when granted)"
    items:
      type: object
      required: [at, actor, action]
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
          enum: [requested, granted, rejected, expired, cancelled, escalated]
        note:
          type: string

  # Escalation chain for multi-approver / critical gates
  escalation:
    type: object
    description: "Optional approval escalation chain"
    properties:
      escalation_chain:
        type: array
        items:
          type: object
          properties:
            approver_id:
              type: string
            timeout_seconds:
              type: integer
              minimum: 1
            fallback:
              type: string
              enum: [next_approver, auto_approve, reject]
      quorum:
        type: integer
        minimum: 1
        description: "Required number of approvals"
      justification_required:
        type: boolean
        default: false

  context:
    type: object
    description: >
      Non-authoritative display payload for the approver UI.
      MUST NOT be used for authorization decisions.

# Coercion approvals require role + TTL + audit when granted
allOf:
  - if:
      properties:
        approval_type:
          const: coercion
        status:
          const: granted
      required: [approval_type, status]
    then:
      required: [approver_role, expires_at, audit_trail]
