# CompensationAction Contract Schema
# Dual-layer saga compensation: abstract workflow intent + concrete durable effects
#
# Abstract → concrete mapping (canonical):
#   rollback_workspace_effects → git_revert, branch_delete, pr_close
#   delete_artifacts           → artifact_delete
#   revoke_access              → revoke_access_token
#   notify                     → send_notification
#   custom                     → resource_cleanup (or custom parameters)

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [action_type, target_ref, idempotency_key, status]
properties:
  action_type:
    type: string
    enum:
      - rollback_workspace_effects
      - delete_artifacts
      - revoke_access
      - notify
      - custom
    description: "Abstract compensation intent (Workflow Context)"

  target_ref:
    type: string
    description: "task_id or step_id whose durable_effects are compensated"

  workflow_step_id:
    type: string
    description: "Workflow step that produced the durable effects"

  produced_in_session_id:
    type: string
    format: uuid
    description: "AgentSession whose Workspace.durable_effects are the compensation target"

  idempotency_key:
    type: string
    description: "Idempotency key for this compensation action"

  parameters:
    type: object

  # Snapshot of durable effects at compensation time (for replay verification).
  # effects_log preserves creation order so compensation can reverse chronologically.
  durable_effects_snapshot:
    type: object
    description: "Copy of Workspace.durable_effects at the moment compensation was planned"
    properties:
      branch_name:
        type: string
      head_commit:
        type: string
      pr_number:
        type: integer
      remote_url:
        type: string
        format: uri
      artifact_ids:
        type: array
        items:
          type: string
          format: uuid
      effects_log:
        type: array
        description: "P2-COMPENSATION-EFFECTS: Ordered creation log (compensation iterates in descending sequence)"
        items:
          type: object
          required: [sequence, effect_type, target, created_at]
          properties:
            sequence:
              type: integer
              minimum: 0
              description: "Monotonic ordering key; compensation MUST iterate in descending sequence order"
            effect_type:
              type: string
              enum: [branch_create, commit, pr_open, artifact_publish, other]
            target:
              type: string
            created_at:
              type: string
              format: date-time

  concrete_actions:
    type: array
    description: "Execution-context mapping resolved at step completion"
    items:
      type: object
      required: [effect_type, target, idempotency_key]
      properties:
        effect_type:
          type: string
          enum:
            - git_revert
            - branch_delete
            - pr_close
            - artifact_delete
            - resource_cleanup
            - revoke_access_token
            - send_notification
        target:
          type: string
          description: >
            Commit SHA (git_revert), branch name (branch_delete), PR number as string
            (pr_close), artifact UUID (artifact_delete), token/resource ref otherwise
        target_kind:
          type: string
          enum: [commit_sha, branch_name, pr_number, artifact_id, token_ref, resource_ref, url]
          description: "Discriminates how target is interpreted for verification"
        idempotency_key:
          type: string
          description: "Per-concrete-action idempotency key"
        parameters:
          type: object
        # Pre-execution verification (prevents silent failure on stale refs)
        verification:
          type: object
          description: "Result of checking that target still exists before compensating"
          properties:
            verified_at:
              type: string
              format: date-time
            exists:
              type: boolean
              description: "False if commit/PR/branch/artifact no longer found"
            remote_checked:
              type: boolean
              default: true
            verification_error:
              type: string
            # P0-COMPENSATION-DEADLOCK: merge commit and divergence handling
            merge_commit:
              type: boolean
              default: false
              description: "True when target is a merge commit (requires -m flag for revert)"
            requires_revert_strategy:
              type: string
              enum: [simple, revert_merge, revert_no_commit]
              description: >
                Determines revert behavior. simple = standard git_revert.
                revert_merge = merge commit requires -m flag.
                revert_no_commit = revert without committing (for manual resolution).
            diverged:
              type: boolean
              default: false
              description: >
                True when target exists but state has changed (force-push, commit-SHA
                mismatch, already-closed PR). Sets status=diverged for operator intervention.
        attempts:
          type: integer
          minimum: 0
          default: 0
          description: "Compensation attempt counter for this concrete action"
        last_error_uri:
          type: string
          description: "URI to last error evidence when failed"
        retry_policy:
          type: object
          properties:
            max_attempts:
              type: integer
              minimum: 1
              default: 3
            backoff_seconds:
              type: integer
              minimum: 1
              default: 30

  status:
    type: string
    enum: [pending, completed, failed, skipped, verification_failed, diverged]
    description: >
      verification_failed = target no longer exists; escalate via EscalationSignal.
      diverged = target exists but state has changed (force-push, commit-SHA mismatch,
      already-closed PR); requires operator intervention or revert-strategy selection.

  executed_at:
    type: string
    format: date-time

  error:
    type: string

  remediation_steps:
    type: array
    items:
      type: string
    description: "Structured remediation when status=failed (required for EscalationSignal path)"

  # P0-COMPENSATION-DEADLOCK: verification timeout and retry
  verification_timeout_seconds:
    type: integer
    minimum: 1
    default: 30
    description: "Max seconds to wait for remote verification (git, PR API) before failing"
  verification_retry_policy:
    type: object
    properties:
      max_attempts:
        type: integer
        minimum: 1
        default: 3
      backoff_seconds:
        type: integer
        minimum: 1
        default: 5
    description: "Retry policy for transient verification failures (network, rate limit)"

allOf:
  - if:
      properties:
        status:
          enum: [failed, verification_failed, diverged]
      required: [status]
    then:
      required: [error, remediation_steps]
      description: "Failed/verification_failed/diverged compensation MUST carry remediation for EscalationSignal path"
  - if:
      properties:
        action_type:
          const: rollback_workspace_effects
      required: [action_type]
    then:
      description: "Workspace rollback SHOULD include durable_effects_snapshot for reverse-order replay"
