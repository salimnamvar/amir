# CompensationAction Contract Schema
# Dual-layer saga compensation: abstract workflow intent + concrete durable effects

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [action_type, target_ref]
properties:
  action_type:
    type: string
    enum:
      - rollback_workspace_effects
      - delete_artifacts
      - revoke_access
      - notify
      - custom
    description: "Abstract compensation intent (Workflow Context)"
  target_ref:
    type: string
    description: "task_id or step_id whose durable_effects are compensated"
  parameters:
    type: object
  concrete_actions:
    type: array
    description: "Execution-context mapping resolved at step completion"
    items:
      type: object
      required: [effect_type, target]
      properties:
        effect_type:
          type: string
          enum: [git_revert, branch_delete, pr_close, artifact_delete, resource_cleanup]
        target:
          type: string
          description: "Commit SHA, branch name, PR number, or artifact id"
        parameters:
          type: object
  status:
    type: string
    enum: [pending, completed, failed, skipped]
  executed_at:
    type: string
    format: date-time
  error:
    type: string
