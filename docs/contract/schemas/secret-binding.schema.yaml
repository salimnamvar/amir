# SecretBinding Contract Schema
# Ephemeral secret grants with TTL for secure secret injection into sandboxes

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [binding_id, task_id, secret_name, injected_at, expires_at]
properties:
  binding_id:
    type: string
    format: uuid
    description: "Unique secret binding identifier"

  task_id:
    type: string
    format: uuid
    description: "Task this secret binding belongs to"

  session_id:
    type: string
    format: uuid
    description: "AgentSession this secret injection is valid for (if created)"

  secret_name:
    type: string
    description: "Name of the secret as referenced in policies"

  secret_ref:
    type: string
    description: "Internal reference to secret in vault (e.g., kms:// or vault://)"

  injected_at:
    type: string
    format: date-time
    description: "When secret was injected into sandbox"

  expires_at:
    type: string
    format: date-time
    description: "TTL-based expiration for automatic cleanup"

  access_method:
    type: string
    enum: [env, file, proxy]
    description: "How secret is accessed in sandbox: env var, tmpfs file, or proxy-forwarded"

  access_path:
    type: string
    description: "Path or env var name for secret access (e.g., /secrets/token or GITHUB_TOKEN)"

  # One-time use flag for sensitive operations
  single_use:
    type: boolean
    default: false
    description: "Secret invalidated after first read"

  status:
    type: string
    enum: [active, used, expired, revoked]
    default: "active"
    description: "Current lifecycle state of this binding"

  created_by:
    type: string
    description: "Principal that created this binding"

  revoked_at:
    type: string
    format: date-time
    description: "When secret was revoked (if applicable)"