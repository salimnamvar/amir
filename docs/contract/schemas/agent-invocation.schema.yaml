# Agent Invocation Request Schema
# Request contract for invoking an agent to perform work
# Updated: AgentSession model with retry context and output contract

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [task_id, agent_definition_id, contract, workspace, idempotency_key]
properties:
  # References
  task_id:
    type: string
    format: uuid
    description: "Parent task identifier"
  
  agent_definition_id:
    type: string
    format: uuid
    description: "Agent to invoke"
  
  # Idempotency
  idempotency_key:
    type: string
    description: "Unique key for idempotent execution"
  
  # Session chain (for retries)
  attempt_number:
    type: integer
    minimum: 1
    default: 1
    description: "Current attempt number (1-indexed)"
  
  previous_session_id:
    type: string
    format: uuid
    description: "Previous session ID (for retry chain)"
  
  # Contract to execute
  contract:
    type: object
    required: [type, version, data]
    properties:
      type:
        type: string
        description: "Contract type (e.g., 'CodeChangeArtifact')"
      version:
        type: string
        description: "Required contract version"
      data:
        type: object
        description: "Contract input data"
  
  # Expected output contract
  expected_output_contract:
    type: object
    required: [type, version]
    properties:
      type:
        type: string
        description: "Expected artifact contract type"
      version:
        type: string
        description: "Expected contract version"
  
  # Output mode negotiation
  output_mode:
    type: string
    enum: [json_schema, tool_use, markdown_yaml, free_text]
    description: "Preferred output mode for agent"
  
  # Feedback from previous attempt
  feedback:
    $ref: "feedback.schema.yaml"
  
  # Workspace configuration
  workspace:
    type: object
    required: [repo_url, branch, workdir]
    properties:
      repo_url:
        type: string
        format: uri
        description: "Git repository URL"
      branch:
        type: string
        description: "Branch to work on (will be created if needed)"
      workdir:
        type: string
        description: "Working directory in sandbox"
  
  # Resource constraints
  resource_limits:
    type: object
    required: [timeout_seconds]
    properties:
      max_tokens:
        type: integer
        minimum: 1
        description: "Maximum tokens to consume (hard limit)"
      max_usd:
        type: number
        minimum: 0
        description: "Maximum USD cost (hard limit)"
      timeout_seconds:
        type: integer
        minimum: 1
        description: "Execution timeout in seconds"
  
  # Replay metadata
  replay_metadata:
    type: object
    properties:
      model_identifier:
        type: string
      seed:
        type: integer
      agent_version:
        type: string
