# Team Contract Schema
# Pure schema for team definitions

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [name]
properties:
  # Team identity
  name:
    type: string
    description: "Team name (lowercase, machine-readable)"
    pattern: "^[a-z][a-z0-9_-]*$"
    maxLength: 100
  
  description:
    type: string
    description: "Team purpose and scope"
  
  # Namespace configuration (multi-tenant)
  namespace:
    type: string
    description: "Kubernetes/database namespace"
  
  # Role bindings
  roles:
    type: array
    items:
      type: object
      required: [name, ref]
      properties:
        name:
          type: string
          description: "Role name in this team"
        ref:
          type: string
          format: uuid
          description: "RoleDefinition ID"
  
  # Agent bindings
  agent_bindings:
    type: array
    items:
      type: object
      required: [role, agent]
      properties:
        role:
          type: string
          description: "Role this agent binding applies to"
        agent:
          type: string
          format: uuid
          description: "AgentDefinition ID"
  
  # Budget and quotas (Phase 2)
  budget:
    type: object
    properties:
      daily_usd_limit:
        type: number
        minimum: 0
      monthly_token_limit:
        type: integer
        minimum: 0
      max_concurrent_tasks:
        type: integer
        minimum: 1
        default: 10