# Capability Contract Schema
# Pure schema for capability definitions

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [skill]
properties:
  # Unique skill identifier
  skill:
    type: string
    description: "Unique skill identifier"
    pattern: "^[a-z][a-z0-9-\\.]*$"
    examples: ["code-generation", "testing.unit", "code-review.security"]
  
  description:
    type: string
    description: "Human-readable skill description"
  
  # Proficiency level
  proficiency:
    type: string
    enum: [novice, intermediate, expert]
    description: "Skill proficiency level"
  
  # Supported languages
  languages:
    type: array
    items:
      type: string
    description: "Supported programming languages"