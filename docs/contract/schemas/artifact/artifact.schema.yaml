# Artifact Contract Schema
# Machine-readable contract for artifacts produced by agents
# Updated: lineage, observation method, idempotency, coercion approval enforcement

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [contract_type, contract_version, content, idempotency_key]
properties:
  # Contract identity
  contract_type:
    type: string
    description: "Artifact contract type"
  
  contract_version:
    type: string
    description: "Artifact contract version"
  
  # Idempotency
  idempotency_key:
    type: string
    description: "Unique key for idempotent artifact production"
  
  # Artifact content (contract-specific)
  content:
    type: object
    description: "Artifact payload - structure defined by contract_type"
  
  # Provenance (immutable)
  provenance:
    type: object
    required: [produced_by_agent_id, task_id]
    properties:
      produced_by_agent_id:
        type: string
        format: uuid
      task_id:
        type: string
        format: uuid
      agent_session_id:
        type: string
        format: uuid
      workflow_instance_id:
        type: string
        format: uuid
      timestamp:
        type: string
        format: date-time
      sandbox_id:
        type: string
        format: uuid
  
  # Integrity
  checksum:
    type: string
    description: "SHA256 of content for tamper detection"
  
  # Lineage
  derived_from:
    type: array
    items:
      type: string
      format: uuid
    description: "Artifact IDs this artifact was derived from"
  
  supersedes:
    type: string
    format: uuid
    description: "Artifact ID this artifact replaces"
  
  # Observation method (how content was derived — distinct from ParserStrategy)
  # ParserStrategy (structured_output, tool_call_interception, …) lives on ValidationResult.
  # ObservationMethod describes the ground-truth relationship of the artifact to the workspace.
  observation_method:
    $ref: "../shared-enums.schema.yaml#/$defs/ObservationMethod"
    description: >
      How artifact was derived. workspace_diff is preferred ground truth.
      synthesized requires llm_coercion approval (coercion_approval_id) and is not default.
      Do NOT embed claim_reconciliation here — reference ValidationResult only.

  # Single canonical pointer to ValidationResult (which owns claim_reconciliation).
  # Do not add a second claim_reconciliation_validation_id field — one ID only.
  validation_result_id:
    type: string
    format: uuid
    description: >
      Reference to ValidationResult for this artifact. ValidationResult holds the
      canonical claim_reconciliation; do not duplicate that structure on Artifact.

  # When llm_coercion is used, synthesized is required and approval_id must be set
  coercion_approval_id:
    type: string
    format: uuid
    description: "Required when observation_method=synthesized; references Approval with status=granted that authorized coercion"

  sandbox_attestation_id:
    type: string
    format: uuid
    description: "SandboxAttestation under which this artifact was produced"
  
  # Status
  status:
    type: string
    enum: [produced, validated, accepted, rejected]
    default: "produced"

# Structural enforcement: synthesized artifacts require coercion approval
allOf:
  - if:
      properties:
        observation_method:
          const: synthesized
    then:
      required: [coercion_approval_id]
  # P0-ARTIFACT-VALID-STATUS: validated/accepted requires validation_result_id
  # (observation beats claims — agent-produced artifacts cannot self-validate)
  - if:
      properties:
        status:
          enum: [validated, accepted]
    then:
      required: [validation_result_id]

# Contract-specific content shapes (reference definitions).
# Discriminator: contract_type selects the expected content shape.
# The root Artifact schema intentionally allows any content object; runtime validation
# must dispatch on contract_type to the appropriate definition below.
# CI check: implementations MUST validate content.shape against contract_type definitions.
definitions:
  CodeChangeArtifact:
    type: object
    required: [contract_type, contract_version, content]
    properties:
      contract_type:
        const: "CodeChangeArtifact"
      content:
        type: object
        required: [files, changes]
        properties:
          files:
            type: array
            items:
              type: object
              required: [path, operation]
              properties:
                path:
                  type: string
                operation:
                  type: string
                  enum: [create, modify, delete]
                content:
                  type: string
                diff:
                  type: string
          changes:
            type: string
            description: "Summary of changes made"
          tests:
            type: object
            properties:
              added:
                type: array
                items:
                  type: string
              modified:
                type: array
                items:
                  type: string
              command:
                type: string
                description: "Test command to run"
          commit_message:
            type: string

  TestResultArtifact:
    type: object
    required: [contract_type, contract_version, content]
    properties:
      contract_type:
        const: "TestResultArtifact"
      content:
        type: object
        required: [passed, failed, skipped]
        properties:
          passed:
            type: integer
          failed:
            type: integer
          skipped:
            type: integer
          output:
            type: string
          coverage:
            type: number
            minimum: 0
            maximum: 100

  ReviewResultArtifact:
    type: object
    required: [contract_type, contract_version, content]
    properties:
      contract_type:
        const: "ReviewResultArtifact"
      content:
        type: object
        required: [approved, comments]
        properties:
          approved:
            type: boolean
          comments:
            type: array
            items:
              type: string
          score:
            type: number
            minimum: 0
            maximum: 100
