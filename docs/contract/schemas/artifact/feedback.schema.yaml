# Feedback Artifact Schema
# Structured feedback for validation failure → re-invocation loop

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [error_context, attempt_number, max_attempts]
properties:
  error_context:
    type: string
    description: "What went wrong in the previous attempt"
  
  corrections:
    type: array
    items:
      type: string
    description: "Specific suggestions for correction"
  
  # Single control-plane decision field (removed redundant suggested_strategy)
  feedback_strategy:
    type: string
    enum:
      - structural_hint
      - semantic_hint
      - strategy_change
      - agent_change
      - human_intervention
    description: >
      Type of feedback / next control-plane action.
      strategy_change must not select llm_coercion (requires Approval flow, not feedback hint).
  
  previous_raw_output:
    type: string
    maxLength: 10000
    description: "Truncated agent raw output for context (max 10k chars); prefer previous_artifact_id for full content"

  previous_artifact_id:
    type: string
    format: uuid
    description: "Reference to previous attempt artifact (preferred over embedding previous_raw_output)"
  
  previous_artifact:
    type: object
    description: "Previous attempt's artifact summary (if any; non-authoritative display)"
  
  validation_errors:
    type: array
    items:
      type: object
      required: [category, code, message]
      properties:
        category:
          $ref: "../shared-enums.schema.yaml#/$defs/ValidatorFailureCategory"
        code:
          type: string
          description: "Machine-readable error code"
        message:
          type: string
          description: "Human-readable error description"
        path:
          type: string
          description: "JSON path to offending field"
        severity:
          type: string
          enum: [error, warning, info]
  
  attempt_number:
    type: integer
    minimum: 1
    description: "Current retry attempt (1-indexed)"
  
  max_attempts:
    type: integer
    minimum: 1
    description: "Maximum allowed attempts"
  
  # Advisory only — OutputParser / control plane decides strategy; agent does not.
  # llm_coercion excluded: coercion requires Approval, not a feedback hint.
  parser_strategy_hint:
    $ref: "../shared-enums.schema.yaml#/$defs/FeedbackStrategy"
    description: "Optional hint for the next parse chain; not binding; llm_coercion not allowed via hint"

  validation_result_id:
    type: string
    format: uuid
    description: "ValidationResult that produced this feedback (canonical; owns claim_reconciliation)"

# P1-FEEDBACK-DUPLICATION: consistency between feedback_strategy and parser_strategy_hint
allOf:
  - if:
      properties:
        feedback_strategy:
          const: strategy_change
      required: [feedback_strategy]
    then:
      required: [parser_strategy_hint]
      description: "strategy_change must carry a parser_strategy_hint (which strategy to change to)"
  - if:
      properties:
        feedback_strategy:
          enum: [structural_hint, semantic_hint, agent_change, human_intervention]
      required: [feedback_strategy]
    then:
      not:
        required: [parser_strategy_hint]
      description: "Non-strategy-change feedback must not carry parser_strategy_hint"
