# Feedback Artifact Schema
# Structured feedback for validation failure → re-invocation loop

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [error_context, attempt_number, max_attempts]
properties:
  error_context:
    type: string
    description: "What went wrong in the previous attempt"
  
  corrections:
    type: array
    items:
      type: string
    description: "Specific suggestions for correction"
  
  # Single control-plane decision field (removed redundant suggested_strategy)
  feedback_strategy:
    type: string
    enum:
      - structural_hint
      - semantic_hint
      - strategy_change
      - agent_change
      - human_intervention
    description: "Type of feedback / next control-plane action"
  
  previous_raw_output:
    type: string
    maxLength: 10000
    description: "Truncated agent raw output for context (max 10k chars); prefer previous_artifact_id for full content"

  previous_artifact_id:
    type: string
    format: uuid
    description: "Reference to previous attempt artifact (preferred over embedding previous_raw_output)"
  
  previous_artifact:
    type: object
    description: "Previous attempt's artifact summary (if any; non-authoritative display)"
  
  validation_errors:
    type: array
    items:
      type: object
      required: [category, code, message]
      properties:
        category:
          type: string
          enum:
            - structural
            - semantic
            - policy
            - quality
            - behavioral
            - test_execution
            - timeout
            - infrastructure
            - budget_exceeded
        code:
          type: string
          description: "Machine-readable error code"
        message:
          type: string
          description: "Human-readable error description"
        path:
          type: string
          description: "JSON path to offending field"
        severity:
          type: string
          enum: [error, warning, info]
  
  attempt_number:
    type: integer
    minimum: 1
    description: "Current retry attempt (1-indexed)"
  
  max_attempts:
    type: integer
    minimum: 1
    description: "Maximum allowed attempts"
  
  # Advisory only — OutputParser / control plane decides strategy; agent does not.
  # llm_coercion excluded: coercion requires Approval, not a feedback hint.
  parser_strategy_hint:
    type: string
    enum: [structured_output, tool_call_interception, markdown_block, workspace_observation]
    description: "Optional hint for the next parse chain; not binding; llm_coercion not allowed via hint"

  validation_result_id:
    type: string
    format: uuid
    description: "ValidationResult that produced this feedback (canonical; owns claim_reconciliation)"
