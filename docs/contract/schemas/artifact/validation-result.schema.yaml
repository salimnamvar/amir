# ValidationResult Contract Schema
# Structured structural + semantic validation outcome for artifacts and sessions
# Canonical owner of claim_reconciliation (Artifact/Feedback reference by ID only).

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [validation_id, target_type, target_id, valid, validators, error_categories]
properties:
  validation_id:
    type: string
    format: uuid
    description: "Unique validation run identifier"

  target_type:
    type: string
    enum: [artifact, agent_session, compiled_prompt, workspace_observation]
    description: "What was validated"

  target_id:
    type: string
    format: uuid
    description: "ID of the validated entity"

  session_id:
    type: string
    format: uuid
    description: "AgentSession that produced the target (if applicable)"

  task_id:
    type: string
    format: uuid

  valid:
    type: boolean
    description: "True only when all required validators pass with no error-severity findings"

  validators:
    type: array
    minItems: 1
    items:
      type: object
      required: [validator_id, validator_type, status]
      properties:
        validator_id:
          type: string
          description: "Registered validator identifier"
        validator_type:
          type: string
          enum: [structural, semantic, policy, quality, behavioral, test_execution]
        status:
          type: string
          enum: [pass, fail, warn, skipped, timed_out, budget_exceeded]
        score:
          type: number
          minimum: 0
          maximum: 1
        evidence_uri:
          type: string
          description: "URI to validator evidence (logs, reports, diffs)"
        duration_ms:
          type: integer
          minimum: 0
        budget_usd:
          type: number
          minimum: 0
          description: >
            Budget allocated to this validator run. Sum of all validators'
            budget_usd MUST be ≤ Task.validation_budget (enforced by Execution).

  # Aligned with validator_type so every validator failure can produce a category
  error_categories:
    type: array
    items:
      type: object
      required: [category, code, message]
      properties:
        category:
          $ref: "../shared-enums.schema.yaml#/$defs/ValidatorFailureCategory"
        code:
          type: string
          description: "Machine-readable error code (e.g., SCHEMA_REQUIRED_FIELD)"
        message:
          type: string
        path:
          type: string
          description: "JSON path to offending field"
        severity:
          type: string
          enum: [error, warning, info]
          default: error

  warnings:
    type: array
    items:
      type: string

  # Canonical claim reconciliation (authoritative). Artifact and Feedback reference
  # this via validation_result_id — they MUST NOT duplicate this structure.
  claim_reconciliation:
    type: object
    description: >
      Comparison of agent/parser claims against workspace ground truth.
      This is the single authoritative shape; workspace always wins on divergence.
    properties:
      observation_method:
        $ref: "../shared-enums.schema.yaml#/$defs/ObservationMethod"
      claims_match_observation:
        type: boolean
        description: "True when agent/parser claims are consistent with workspace state"
      # authoritative_source is fixed to workspace; retained as const for explicit audit.
      authoritative_source:
        type: string
        const: workspace
        default: workspace
        description: "Always workspace; parser/agent claims never override filesystem ground truth"
      baseline_commit:
        type: string
        description: "Git commit or tree hash before session execution"
      current_commit:
        type: string
        description: "Git commit or tree hash after session execution (or working-tree marker)"
      claimed_paths:
        type: array
        items:
          type: string
      observed_paths:
        type: array
        items:
          type: string
      missing_from_claims:
        type: array
        items:
          type: string
        description: "Paths changed in workspace but absent from agent claims"
      missing_from_observation:
        type: array
        items:
          type: string
        description: "Paths claimed by agent but not present in workspace diff"
      divergence_summary:
        type: string
      parser_strategy_used:
        $ref: "../shared-enums.schema.yaml#/$defs/ParserStrategy"
        description: "Which ParserRegistry strategy produced the claims being reconciled"
      # Required when parser_strategy_used=llm_coercion
      coercion_approval_id:
        type: string
        format: uuid
        description: "Approval authorizing llm_coercion (required when strategy is llm_coercion)"

  validation_duration_ms:
    type: integer
    minimum: 0

  started_at:
    type: string
    format: date-time

  completed_at:
    type: string
    format: date-time

allOf:
  # Artifacts always require claim reconciliation (workspace ground truth)
  - if:
      properties:
        target_type:
          const: artifact
      required: [target_type]
    then:
      required: [claim_reconciliation]
  # llm_coercion requires approval reference on claim reconciliation
  - if:
      properties:
        claim_reconciliation:
          properties:
            parser_strategy_used:
              const: llm_coercion
          required: [parser_strategy_used]
    then:
      properties:
        claim_reconciliation:
          required: [coercion_approval_id]
