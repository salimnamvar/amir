# Role Contract Schema
# Machine-readable contract for role definitions

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [name, responsibility]
properties:
  name:
    type: string
    description: "Role name (lowercase, machine-readable)"
    pattern: "^[a-z][a-z0-9-]*$"
  
  description:
    type: string
    description: "Human-readable role description"
  
  # Role contract
  responsibility:
    type: string
    description: "Primary responsibility of this role"
  
  inputs:
    type: array
    items:
      type: object
      required: [contract_type]
      properties:
        contract_type:
          type: string
          description: "Required input contract type"
        min_version:
          type: string
  
  outputs:
    type: array
    items:
      type: object
      required: [contract_type]
      properties:
        contract_type:
          type: string
          description: "Produced artifact contract type"
        min_version:
          type: string
  
  allowed_actions:
    type: array
    items:
      type: string
    description: "Action verbs this role can perform"
  
  quality_criteria:
    type: object
    properties:
      min_test_coverage:
        type: integer
        minimum: 0
        maximum: 100
      required_approvals:
        type: integer
        minimum: 0
  
  required_capabilities:
    type: array
    items:
      type: object
      required: [skill]
      properties:
        skill:
          type: string
        minimum_proficiency:
          type: string
          enum: [novice, intermediate, expert]