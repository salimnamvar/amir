# Artifact Contract Schema
# Machine-readable contract for artifacts produced by agents
# Updated: Added lineage, observation method, and idempotency

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [contract_type, contract_version, content, idempotency_key]
properties:
  # Contract identity
  contract_type:
    type: string
    description: "Artifact contract type"
  
  contract_version:
    type: string
    description: "Artifact contract version"
  
  # Idempotency
  idempotency_key:
    type: string
    description: "Unique key for idempotent artifact production"
  
  # Artifact content (contract-specific)
  content:
    type: object
    description: "Artifact payload - structure defined by contract_type"
  
  # Provenance (immutable)
  provenance:
    type: object
    required: [produced_by_agent_id, task_id]
    properties:
      produced_by_agent_id:
        type: string
        format: uuid
      task_id:
        type: string
        format: uuid
      agent_session_id:
        type: string
        format: uuid
      workflow_instance_id:
        type: string
        format: uuid
      timestamp:
        type: string
        format: date-time
      sandbox_id:
        type: string
        format: uuid
  
  # Integrity
  checksum:
    type: string
    description: "SHA256 of content for tamper detection"
  
  # Lineage
  derived_from:
    type: array
    items:
      type: string
      format: uuid
    description: "Artifact IDs this artifact was derived from"
  
  supersedes:
    type: string
    format: uuid
    description: "Artifact ID this artifact replaces"
  
  # Observation method
  observation_method:
    type: string
    enum: [workspace_diff, parser_extracted, agent_claims, synthesized]
    description: "How artifact was derived from agent output"
  
  # Status
  status:
    type: string
    enum: [produced, validated, accepted, rejected]
    default: "produced"

# CodeChangeArtifact - produced by developer agents
definitions:
  CodeChangeArtifact:
    type: object
    required: [contract_type, contract_version, content]
    properties:
      contract_type:
        const: "CodeChangeArtifact"
      content:
        type: object
        required: [files, changes]
        properties:
          files:
            type: array
            items:
              type: object
              required: [path, operation]
              properties:
                path:
                  type: string
                operation:
                  type: string
                  enum: [create, modify, delete]
                content:
                  type: string
                diff:
                  type: string
          changes:
            type: string
            description: "Summary of changes made"
          tests:
            type: object
            properties:
              added:
                type: array
                items:
                  type: string
              modified:
                type: array
                items:
                  type: string
              command:
                type: string
                description: "Test command to run"
          commit_message:
            type: string

  TestResultArtifact:
    type: object
    required: [contract_type, contract_version, content]
    properties:
      contract_type:
        const: "TestResultArtifact"
      content:
        type: object
        required: [passed, failed, skipped]
        properties:
          passed:
            type: integer
          failed:
            type: integer
          skipped:
            type: integer
          output:
            type: string
          coverage:
            type: number
            minimum: 0
            maximum: 100

  ReviewResultArtifact:
    type: object
    required: [contract_type, contract_version, content]
    properties:
      contract_type:
        const: "ReviewResultArtifact"
      content:
        type: object
        required: [approved, comments]
        properties:
          approved:
            type: boolean
          comments:
            type: array
            items:
              type: string
          score:
            type: number
            minimum: 0
            maximum: 100
