# Role Contract Schema
# Machine-readable contract for role definitions
# Updated: required_network for allowlist merge; capability $ref discipline

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [name, responsibility]
properties:
  name:
    type: string
    description: "Role name (lowercase, machine-readable)"
    pattern: "^[a-z][a-z0-9-]*$"
  
  description:
    type: string
    description: "Human-readable role description"
  
  # Role contract
  responsibility:
    type: string
    description: "Primary responsibility of this role"
  
  inputs:
    type: array
    items:
      type: object
      required: [contract_type]
      properties:
        contract_type:
          type: string
          description: "Required input contract type"
        min_version:
          type: string
  
  outputs:
    type: array
    items:
      type: object
      required: [contract_type]
      properties:
        contract_type:
          type: string
          description: "Produced artifact contract type"
        min_version:
          type: string
  
  allowed_actions:
    type: array
    items:
      type: string
    description: "Action verbs this role can perform"
  
  quality_criteria:
    type: object
    properties:
      min_test_coverage:
        type: integer
        minimum: 0
        maximum: 100
      max_cyclomatic_complexity:
        type: integer
      required_approvals:
        type: integer
        minimum: 0
      semantic_validators:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            type:
              type: string
              enum: [structural, test_execution, quality, behavioral]
            timeout_seconds:
              type: integer
              default: 300
            budget_usd:
              type: number
              default: 0.10
  
  # Capability requirements are objective hard filters + soft scoring inputs.
  # Subjective proficiency enums are prohibited; use tools/constraints instead.
  # Intentional hard-filter projection (not full Capability $ref): skill + tools +
  # network + max_file_size only. Full Capability lives on AgentDefinition.
  required_capabilities:
    type: array
    items:
      type: object
      required: [skill]
      properties:
        skill:
          type: string
          description: "Hierarchical skill id (e.g., code.generate.python)"
        required_tools:
          type: array
          items:
            type: string
          description: "Hard filter: agent must declare these tools"
        max_file_size_bytes:
          type: integer
          minimum: 1
        requires_network:
          type: boolean
          default: true
          description: "Whether this capability needs egress (package registries / LLM API)"

  # Explicit network destinations required by this role (for allowlist merge).
  # If empty/unset, treat as "no additional role constraint" — skip role layer
  # in the intersection algorithm (do not zero the intersection).
  required_network:
    type: array
    items:
      type: string
    default: []
    description: >
      Domain/hostname allowlist contributions from the role.
      Used in: effective_allowlist = agent_set ∩ sandbox_set [∩ role_set if non-empty].
  
  prompt_template_ref:
    type: string
    description: "Reference to prompt template in amir-config/prompts/"
