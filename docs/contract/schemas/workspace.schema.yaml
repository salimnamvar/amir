# Workspace Contract Schema
# Complete schema for workspace isolation

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [repo_url, branch]
properties:
  # Git configuration
  repo_url:
    type: string
    format: uri
    description: "Git repository URL"
  
  branch:
    type: string
    description: "Git branch for this workspace"
  
  workdir:
    type: string
    description: "Working directory path (default: /workspace)"
    default: "/workspace"
  
  # Isolation markers
  sandbox_id:
    type: string
    format: uuid
    description: "Sandbox this workspace belongs to"
  
  # Cleanup settings
  ephemeral:
    type: boolean
    default: true
    description: "Workspace deleted after task completion"
  
  # Security context
  security_context:
    type: object
    properties:
      network_isolated:
        type: boolean
        default: true
      read_only_root:
        type: boolean
        default: true
      user_id:
        type: integer
        default: 65534