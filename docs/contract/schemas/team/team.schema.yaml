# Team Contract Schema
# Pure schema for team definitions

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [name]
properties:
  # Team identity (UUID used by CostLease.team_id / Task.team_id / CostRecord.team_id)
  team_id:
    type: string
    format: uuid
    description: "Stable team identifier for hierarchical cost attribution"

  tenant_id:
    type: string
    format: uuid
    description: "Parent tenant for 4-level cost hierarchy"

  org_id:
    type: string
    format: uuid
    description: "Parent org for 4-level cost hierarchy"

  name:
    type: string
    description: "Team name (lowercase, machine-readable)"
    pattern: "^[a-z][a-z0-9_-]*$"
    maxLength: 100
  
  description:
    type: string
    description: "Team purpose and scope"
  
  # Namespace configuration (multi-tenant)
  namespace:
    type: string
    description: "Kubernetes/database namespace"
  
  # Role bindings
  roles:
    type: array
    items:
      type: object
      required: [name, ref]
      properties:
        name:
          type: string
          description: "Role name in this team"
        ref:
          type: string
          format: uuid
          description: "RoleDefinition ID"
  
  # Agent bindings
  agent_bindings:
    type: array
    items:
      type: object
      required: [role, agent]
      properties:
        role:
          type: string
          description: "Role this agent binding applies to"
        agent:
          type: string
          format: uuid
          description: "AgentDefinition ID"
  
  # Budget and quotas (hierarchical cost gate)
  # Soft/hard thresholds: Observability uses soft_threshold_pct (warn/throttle) and
  # hard_threshold_pct (revoke_by_scope for in-flight). Not fields on CostLease.
  budget:
    type: object
    properties:
      hourly_usd_limit:
        type: number
        minimum: 0
        description: "Per-team hourly budget for cost ceiling enforcement"
      daily_usd_limit:
        type: number
        minimum: 0
      monthly_token_limit:
        type: integer
        minimum: 0
      max_concurrent_tasks:
        type: integer
        minimum: 1
        default: 10
      soft_threshold_pct:
        type: number
        minimum: 50
        maximum: 100
        default: 80
        description: "Ops soft threshold: reject/throttle new work; do not revoke in-flight"
      hard_threshold_pct:
        type: number
        minimum: 50
        maximum: 100
        default: 100
        description: "Ops hard threshold: CostEnforcer.revoke_by_scope cancels in-flight leases"

  # Default scoring weights for agent matching.
  # Runtime MUST normalize to sum=1.0 if provided weights do not sum to 1.0
  # (pragmatic: YAML configs often drift; garbage-in is corrected at matching time).
  # MatchingDecision.weights records the actual normalized weights used.
  scoring_weights:
    type: object
    description: >
      Default weights for capability matching. Runtime normalizes to sum 1.0.
      If all weights are 0 or omitted, equal weights across 7 dimensions are used.
    properties:
      skill_match:
        type: number
        minimum: 0
        maximum: 1
      language_match:
        type: number
        minimum: 0
        maximum: 1
      tool_match:
        type: number
        minimum: 0
        maximum: 1
      historical_success:
        type: number
        minimum: 0
        maximum: 1
      cost_efficiency:
        type: number
        minimum: 0
        maximum: 1
      latency:
        type: number
        minimum: 0
        maximum: 1
      availability:
        type: number
        minimum: 0
        maximum: 1