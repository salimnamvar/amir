# Workflow Contract Schema
# Complete schema for workflow templates

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [name, states]
properties:
  # Template identity
  name:
    type: string
    description: "Workflow name (lowercase, machine-readable)"
    pattern: "^[a-z][a-z0-9-]*$"
  
  description:
    type: string
    description: "Workflow purpose and pattern"
  
  version:
    type: string
    description: "Workflow version (SemVer)"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  
  # State machine definition
  states:
    type: array
    items:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        tasks:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              objective:
                type: string
              constraints:
                type: object
        approval_gate:
          type: boolean
          default: false
        timeout_seconds:
          type: integer
          minimum: 1
  
  # State transitions
  transitions:
    type: array
    items:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
        trigger:
          type: string
          enum: [on_complete, on_approve, on_timeout]