# Workflow Contract Schema
# Complete schema for workflow templates
# Updated: Added compensation specs and step results

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [name, states]
properties:
  # Template identity
  name:
    type: string
    description: "Workflow name (lowercase, machine-readable)"
    pattern: "^[a-z][a-z0-9-]*$"
  
  description:
    type: string
    description: "Workflow purpose and pattern"
  
  version:
    type: string
    description: "Workflow version (SemVer)"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  
  # State machine definition
  states:
    type: array
    items:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        tasks:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              objective:
                type: string
              constraints:
                type: object
              compensation:
                type: object
                description: >
                  Compensation is declared at two layers: abstract intent (workflow)
                  and concrete effect (execution). Workflow emits abstract actions;
                  Execution maps them to durable resources (git, PR, artifacts).
                  Targets durable side effects — never the ephemeral Workspace filesystem.
                properties:
                  action_type:
                    type: string
                    enum:
                      - rollback_workspace_effects
                      - delete_artifacts
                      - revoke_access
                      - notify
                      - custom
                    description: "Abstract compensation intent owned by Workflow Context"
                  concrete_actions:
                    type: array
                    description: "Execution-context mapping resolved at step completion"
                    items:
                      type: object
                      required: [effect_type, target]
                      properties:
                        effect_type:
                          type: string
                          enum: [git_revert, branch_delete, pr_close, artifact_delete, resource_cleanup]
                        target:
                          type: string
                          description: "Durable target (commit SHA, branch name, PR number, artifact id)"
                        parameters:
                          type: object
                  target_ref:
                    type: string
                    description: "task_id or step_id whose durable_effects are compensated"
                  parameters:
                    type: object
        approval_gate:
          type: boolean
          default: false
        timeout_seconds:
          type: integer
          minimum: 1
  
  # State transitions
  transitions:
    type: array
    items:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
        trigger:
          type: string
          enum: [on_complete, on_approve, on_timeout, on_fail, on_compensate, on_compensation_blocked]

  # Events for compensation lifecycle
  events:
    - Compensation.Started
    - Compensation.Executed
    - Compensation.Failed
    - Compensation.Blocked  # Triggers human escalation
    - Escalation.Signal
  
  # Compensation configuration
  compensation:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      strategy:
        type: string
        enum: [reverse_order, parallel, selective]
        default: "reverse_order"
      max_compensation_attempts:
        type: integer
        minimum: 1
        default: 3
      # Compensation failure handling:
      # - continue_on_compensation_failure=false (default) causes COMPENSATION_BLOCKED state
      # - COMPENSATION_BLOCKED triggers human escalation via EscalationSignal
      continue_on_compensation_failure:
        type: boolean
        default: false
        description: "If false, compensation failure blocks workflow and triggers human escalation"
      escalation_on_blocked:
        type: boolean
        default: true
        description: "Emit EscalationSignal when entering COMPENSATION_BLOCKED state"
