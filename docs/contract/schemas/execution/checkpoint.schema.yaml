# Checkpoint Contract Schema
# Immutable session state sample; full history is event/table backed

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [checkpoint_id, session_id, state, timestamp, sequence]
properties:
  checkpoint_id:
    type: string
    format: uuid
  session_id:
    type: string
    format: uuid
  sequence:
    type: integer
    minimum: 0
    description: "Monotonic ordering key within session; preferred over timestamp for replay"
  state:
    type: string
    description: "Session status at checkpoint time"
  timestamp:
    type: string
    format: date-time
  payload:
    type: object
    maxProperties: 32
    description: "State-specific snapshot data (bounded; large state must use external refs)"
  workspace_snapshot:
    type: string
    description: "Git commit or tree hash at this checkpoint"
