# Workspace Contract Schema
# Ephemeral execution filesystem. Owned by Execution Context.
# Cardinality: Task 1 → 1..* Workspace (one Workspace per AgentSession attempt).
# Security Context enforces policy; it does not own the Workspace aggregate.
#
# Auto-commit invariant (normative):
# After observation and BEFORE ephemeral cleanup, AgentExecutor MUST ensure a durable
# commit exists for any working-tree changes and update durable_effects.head_commit.
# If the agent produced no commit, the control plane synthesizes one from the diff.
# Observation without a durable commit is invalid for compensation-capable sessions.
# durable_effects are appended incrementally as effects are created (not only at end).

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [workspace_id, task_id, session_id, repo_url, branch, status]
properties:
  workspace_id:
    type: string
    format: uuid
    description: "Unique workspace identifier"

  task_id:
    type: string
    format: uuid
    description: "Parent task (many workspaces per task across retries)"

  session_id:
    type: string
    format: uuid
    description: "Owning AgentSession (exactly one session per workspace; unique in DDL)"

  # Git configuration
  repo_url:
    type: string
    format: uri
    description: "Git repository URL"

  branch:
    type: string
    description: "Git branch for this workspace (amir/{task_id}/{role_name} pattern recommended)"

  workdir:
    type: string
    description: "Working directory path (default: /workspace)"
    default: "/workspace"

  # Lifecycle
  # observed requires successful auto-commit of durable changes (or no changes).
  # auto_commit_failed: observation done but durable commit/push failed — must not clean
  # until operator remediation or retry; durable_effects may be partial.
  status:
    type: string
    enum: [created, active, observed, auto_commit_failed, cleaned, failed]
    description: "Workspace lifecycle state"

  auto_commit:
    type: object
    description: "Control-plane auto-commit outcome before cleanup"
    properties:
      attempted:
        type: boolean
        default: false
      committed:
        type: boolean
      pushed:
        type: boolean
        description: "False if local commit ok but remote push failed"
      head_commit:
        type: string
      error:
        type: string
        description: "Present when status=auto_commit_failed"
      attempted_at:
        type: string
        format: date-time
      atomic_with_observation:
        type: boolean
        default: true
        description: >
          When true, durable_effects update and observation record are written
          in the same transaction as the local commit record.

  # Isolation markers
  sandbox_id:
    type: string
    format: uuid
    description: "Sandbox this workspace is mounted into"

  # Observation baselines (ground truth for artifact synthesis)
  baseline_commit:
    type: string
    description: "Git HEAD (or tree hash) recorded before agent execution"

  current_commit:
    type: string
    description: "Git HEAD (or tree hash) after agent execution / observation"

  baseline_tree_hash:
    type: string
    description: "Full tree hash for observation even if agent does not commit"

  # Durable side-effect handles (survive workspace cleanup; used by compensation)
  # Append-only log semantics: effects are recorded as created during execution so
  # budget-killed sessions still have a compensation target list.
  durable_effects:
    type: object
    description: "References to durable repo/PR state produced while workspace was active"
    properties:
      branch_name:
        type: string
      head_commit:
        type: string
        description: "Must be a real commit SHA after auto-commit (required for git_revert)"
      pr_number:
        type: integer
      remote_url:
        type: string
        format: uri
      effects_log:
        type: array
        description: "Incremental log of durable effects as they were created"
        items:
          type: object
          required: [effect_type, target, created_at]
          properties:
            effect_type:
              type: string
              enum: [branch_create, commit, pr_open, artifact_publish, other]
            target:
              type: string
            created_at:
              type: string
              format: date-time

  # Cleanup settings
  ephemeral:
    type: boolean
    default: true
    description: "Local sandbox filesystem deleted after session terminal state"

  cleaned_at:
    type: string
    format: date-time
    description: "When ephemeral filesystem was destroyed; durable_effects remain for compensation"

  # Security context (enforced by Security Context policies at creation)
  security_context:
    type: object
    properties:
      network_isolated:
        type: boolean
        default: true
      read_only_root:
        type: boolean
        default: true
      user_id:
        type: integer
        default: 65534
      network_mode:
        $ref: "../shared-enums.schema.yaml#/$defs/NetworkMode"
        default: proxy
      network_allowlist:
        type: array
        items:
          type: string
        description: "Effective allowlist after SandboxPolicy intersection merge (alias of effective_allowlist)"
      effective_allowlist:
        type: array
        items:
          type: string
        description: >
          Computed by Security Context via allowlist-merge.schema.yaml (intersection).
          Authoritative egress surface; sandbox MUST enforce this list.
      effective_allowlist_hash:
        type: string
        description: "SHA256 of sorted effective_allowlist; sandbox must verify match"
      sandbox_policy_id:
        type: string
        format: uuid
        description: "SandboxPolicy evaluation that produced this allowlist"
      allowlist_merge_signature:
        type: string
        description: "Security Context signature over effective_allowlist_hash"

  created_at:
    type: string
    format: date-time

  observed_at:
    type: string
    format: date-time

allOf:
  # Cannot clean ephemeral FS while auto_commit failed (durable commit incomplete)
  - if:
      properties:
        status:
          const: cleaned
      required: [status]
    then:
      not:
        properties:
          auto_commit:
            properties:
              committed:
                const: false
            required: [committed]
  - if:
      properties:
        status:
          const: auto_commit_failed
      required: [status]
    then:
      properties:
        auto_commit:
          required: [error, attempted]
      required: [auto_commit]
  # status=observed requires auto_commit.committed=true (durable commit exists for compensation)
  # If auto_commit.attempted=false (no changes), committed=true still required as sentinel
  - if:
      properties:
        status:
          const: observed
      required: [status]
    then:
      required: [auto_commit]
      properties:
        auto_commit:
          required: [committed]
          properties:
            committed:
              const: true
              description: "Required when status=observed; compensation needs durable commit target"

