# Task Contract Schema
# Work unit awaiting execution. Cost ceiling is structurally required.
# Circuit breaking is agent-scoped (AgentScorecard), not task-scoped.

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [title, objective, assigned_role, idempotency_key, cost_budget, validation_budget]
properties:
  # Core identity
  id:
    type: string
    format: uuid
    description: "Task identifier"

  idempotency_key:
    type: string
    description: "Unique key for idempotent task creation"

  title:
    type: string
    description: "Human-readable task title"
    maxLength: 200

  objective:
    type: string
    description: "Natural language objective"
    minLength: 1

  description:
    type: string
    description: "Detailed task description"

  # Role assignment
  assigned_role:
    type: string
    description: "Role to perform this task"

  # Hierarchy attribution (4-level cost hierarchy)
  team_id:
    type: string
    format: uuid
  tenant_id:
    type: string
    format: uuid
  org_id:
    type: string
    format: uuid

  # Lifecycle status
  # Aligns with model.md Task state diagram: Pending → Assigned → Running → Validating → terminal
  status:
    type: string
    enum:
      - pending
      - assigned
      - running
      - validating
      - succeeded
      - failed
      - cancelled
      - escalated
    default: pending
    description: >
      Task lifecycle. Success terminal is succeeded (event Task.Completed maps here).
      matching_decision_id required for assigned/running/validating.
      last_failure_category required for failed/cancelled.
      escalated = human/agent reassignment path (EscalationSignal); not a session status.

  # Input artifacts
  inputs:
    type: array
    items:
      type: string
      format: uuid
    description: "Artifact IDs to provide as input"

  # Expected outputs (typed contract references)
  expected_outputs:
    type: array
    items:
      type: object
      required: [type, version]
      properties:
        type:
          type: string
          description: "Expected artifact contract type"
        version:
          type: string
          description: "Expected contract version"
    description: "Expected artifact contract types with versions"

  # Constraints
  constraints:
    type: object
    description: "Rules for execution"
    properties:
      follow_solid:
        type: boolean
        default: true
      max_file_changes:
        type: integer
        minimum: 1
      excluded_paths:
        type: array
        items:
          type: string
      required_tools:
        type: array
        items:
          type: string
        description: "Hard filter: agent must declare these tools"
      max_file_size_bytes:
        type: integer
        minimum: 1

  # Dependencies
  depends_on:
    type: array
    items:
      type: string
      format: uuid

  # Priority
  priority:
    type: string
    enum: [critical, high, normal, low, background]
    default: "normal"

  # Cost controls — at least one ceiling is mandatory (cost is a runtime invariant)
  cost_budget:
    type: object
    minProperties: 1
    description: "Hard cost ceiling for execution pool; at least one of max_tokens or max_usd is required"
    properties:
      max_tokens:
        type: integer
        minimum: 1
      max_usd:
        type: number
        minimum: 0
      reservation_buffer_pct:
        type: number
        minimum: 0
        maximum: 50
        default: 10
        description: "Extra headroom reserved beyond estimate; applied when creating CostLease"
    anyOf:
      - required: [max_tokens]
      - required: [max_usd]

  # Validation/repair budget — partitioned from execution budget to prevent starvation
  # Enforced via a separate CostLease with budget_pool=validation.
  # REQUIRED — partitioned from execution; never optional (financial safety).
  validation_budget:
    type: object
    minProperties: 1
    description: >
      REQUIRED budget for validation feedback loop; separate CostLease budget_pool=validation.
      sum(ValidationResult.validators[*].budget_usd) MUST be ≤ validation_budget.
      Exhaustion sets last_failure_category=budget_exceeded on the validation path
      without consuming the execution CostLease. Never omitted.
    properties:
      max_tokens:
        type: integer
        minimum: 1
      max_usd:
        type: number
        minimum: 0
      reservation_buffer_pct:
        type: number
        minimum: 0
        maximum: 20
        default: 5
        description: "Buffer for validation chain retries"
    anyOf:
      - required: [max_tokens]
      - required: [max_usd]

  validation_lease_id:
    type: string
    format: uuid
    description: "CostLease (budget_pool=validation) for the current validation cycle"

  # Retry policy (task-scoped attempt accounting — NOT a circuit breaker)
  # retry_on values align with last_failure_category vocabulary for computable retry eligibility
  retry_policy:
    type: object
    properties:
      max_attempts:
        type: integer
        minimum: 1
        default: 3
      backoff_seconds:
        type: integer
        minimum: 1
        default: 60
      backoff_strategy:
        type: string
        enum: [exponential, linear, fixed]
        default: "exponential"
      retry_on:
        type: array
        items:
          $ref: "../shared-enums.schema.yaml#/$defs/TerminalFailureCategory"
        default:
          - structural
          - semantic
          - policy
          - quality
          - timeout
          - infrastructure
          - behavioral
          - test_execution
        description: >
          Failure categories that trigger retry (items $ref TerminalFailureCategory).
          Default excludes budget_exceeded, cancelled, circuit_breaker_open (escalate).
          circuit_breaker_open means the agent's circuit breaker tripped — tasks must
          escalate to a different agent rather than retry on the same one.
          behavioral and test_execution are retryable by default (validator-origin categories).
          infrastructure included as typically transient.
      escalate_after:
        type: integer
        minimum: 1
        default: 2
        description: "Escalate to different agent after N failures"

  # Task-scoped attempt state (distinct from agent-level circuit breaker)
  retry_state:
    type: object
    description: "Per-task retry bookkeeping. Circuit breakers live on AgentScorecard only."
    properties:
      attempts:
        type: integer
        minimum: 0
        default: 0
        description: "Incremented by Task saga coordinator in the same transaction as AgentSession create"
      consecutive_failures:
        type: integer
        minimum: 0
        default: 0
      last_failure_category:
        $ref: "../shared-enums.schema.yaml#/$defs/TerminalFailureCategory"
        description: >
          Category of last failure; used for retry eligibility.
          Must match AgentSession.last_failure_category vocabulary.
      last_session_id:
        type: string
        format: uuid
      validation_budget_consumed_usd:
        type: number
        minimum: 0
        default: 0
        description: "Cumulative validation spend across attempts"
      escalated:
        type: boolean
        default: false

  # Workspace lineage: Task 1 → 1..* Workspace (one per AgentSession attempt)
  active_workspace_id:
    type: string
    format: uuid
    description: "Workspace for the current attempt; prior attempts retain their own workspaces until cleaned"

  previous_workspace_ids:
    type: array
    items:
      type: string
      format: uuid
    description: "Lineage of prior attempt workspaces"

  matching_decision_id:
    type: string
    format: uuid
    description: "MatchingDecision that selected the current agent"

# Conditional structural requirements
allOf:
  # matching_decision_id required once an agent has been selected
  - if:
      properties:
        status:
          enum: [assigned, running, validating]
    then:
      required: [matching_decision_id]
  # Terminal failure/cancel requires category for retry eligibility
  - if:
      properties:
        status:
          enum: [failed, cancelled]
    then:
      required: [retry_state]
      properties:
        retry_state:
          required: [last_failure_category]
