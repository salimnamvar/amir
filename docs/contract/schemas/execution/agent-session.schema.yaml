# Agent Session Schema
# Central durable execution aggregate. AgentInvocation is the request DTO that
# creates a session; runtime truth lives here (checkpoints, cost, validation, workspace).

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required:
  - session_id
  - task_id
  - agent_definition_id
  - attempt_number
  - status
  - idempotency_key
  - resource_limits
properties:
  session_id:
    type: string
    format: uuid
    description: "Unique session identifier"

  idempotency_key:
    type: string
    description: "Typically SHA256(task_id + attempt_number)"
  
  task_id:
    type: string
    format: uuid
    description: "Parent task identifier"
  
  agent_definition_id:
    type: string
    format: uuid
    description: "Agent executing in this session"

  matching_decision_id:
    type: string
    format: uuid
    description: "MatchingDecision that selected this agent"
  
  attempt_number:
    type: integer
    minimum: 1
    description: "Attempt number (1-indexed)"
  
  previous_session_id:
    type: string
    format: uuid
    description: "Previous session ID (for retry chain)"
  
  status:
    type: string
    enum:
      - pending
      - starting
      - running
      - waiting_for_input
      - producing_artifact
      - validating
      - succeeded
      - failed
      - compensating
      - timed_out
      - cancelled
  
  workspace_id:
    type: string
    format: uuid
    description: "Exclusive workspace for this session (Task 1 → * Workspace via sessions)"
  
  sandbox_id:
    type: string
    format: uuid

  sandbox_attestation_id:
    type: string
    format: uuid
    description: "SandboxAttestation recorded at session start"
  
  compiled_prompt_id:
    type: string
    format: uuid
    description: "Reference to CompiledPrompt artifact"

  cost_lease_id:
    type: string
    format: uuid
    description: "CostLease reference for synchronous hard kill on budget breach"

  # Hard resource ceilings (structurally enforced)
  resource_limits:
    type: object
    required: [timeout_seconds]
    properties:
      max_tokens:
        type: integer
        minimum: 1
      max_usd:
        type: number
        minimum: 0
      timeout_seconds:
        type: integer
        minimum: 1
    anyOf:
      - required: [max_tokens]
      - required: [max_usd]
  
  # --- Aggregate hygiene (anti–God Object) ---
  # High-frequency data lives in event streams / linked tables, not the session document.
  # Session retains only: identity, status, references, latest metering snapshot,
  # recent ring-buffer samples for debugging, and replay metadata IDs.
  #
  # Full histories:
  #   checkpoints  → checkpoints table + AgentSession.Checkpoint events
  #   tool_calls   → tool_call_events stream + AgentSession.ToolCall events
  #   resource_usage history → CostRecord + Cost.Recorded events
  # Session document holds at most a recent sample window (ring buffer).

  # Recent checkpoint IDs only; full Checkpoint rows are linked artifacts/events
  recent_checkpoint_ids:
    type: array
    maxItems: 20
    items:
      type: string
      format: uuid
    description: "Ring buffer of latest checkpoint IDs; authoritative store is checkpoints table / events"

  # Optional embedded recent checkpoints for hot-path recovery (bounded)
  checkpoints:
    type: array
    maxItems: 20
    description: "Recent checkpoint samples only; not the full history"
    items:
      $ref: "checkpoint.schema.yaml"

  # Recent tool-call samples only; full history is ToolCallEvent stream
  tool_calls:
    type: array
    maxItems: 50
    description: "Ring buffer of recent tool calls for debugging; full history in event stream"
    items:
      $ref: "tool-call.schema.yaml"

  tool_call_event_stream_ref:
    type: string
    description: "Reference to full tool-call event stream (topic/partition or object key)"

  # Interactive prompt handling (CLI agents that request input)
  pending_input:
    type: object
    description: "Present when status=waiting_for_input"
    properties:
      prompt_text:
        type: string
      input_kind:
        type: string
        enum: [clarification, approval, secret, choice, freeform]
      auto_response_rule:
        type: string
        description: "Matched auto-response rule id, if any"
      timeout_seconds:
        type: integer
        minimum: 1
  
  validation_result_id:
    type: string
    format: uuid
    description: "Reference to standalone ValidationResult contract"

  validation_result:
    $ref: "../artifact/validation-result.schema.yaml"
  
  feedback_artifact:
    $ref: "../artifact/feedback.schema.yaml"
  
  # Live metering (sidecar); not the durable CostRecord
  # For long-running sessions, this is the latest snapshot; full history in CostRecord.
  # CostLease cancellation check is synchronous on each metering tick.
  resource_usage:
    type: object
    description: "Latest usage snapshot; authoritative accounting is CostRecord. Checked against CostLease for synchronous hard kill."
    properties:
      tokens_consumed:
        type: integer
      cost_usd:
        type: number
      duration_seconds:
        type: number
      cpu_seconds:
        type: number
      memory_peak_mb:
        type: number

  cost_record_id:
    type: string
    format: uuid
    description: "Authoritative CostRecord in Observability Context"
  
  replay_metadata:
    $ref: "replay-metadata.schema.yaml"
  
  started_at:
    type: string
    format: date-time
  
  completed_at:
    type: string
    format: date-time

