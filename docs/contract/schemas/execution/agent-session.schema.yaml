# Agent Session Schema
# Central durable execution aggregate. AgentInvocation is the request DTO that
# creates a session; runtime truth lives here (checkpoints, cost, validation, workspace).
#
# Lean-aggregate invariant (anti–God Object):
# Session retains only: identity, status, references, latest metering snapshot,
# recent ring-buffer ID samples for debugging, and replay metadata IDs.
# Full ValidationResult / Feedback live in their own tables (IDs only here).
# Full checkpoint/tool-call histories live in event streams / linked tables.

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required:
  - session_id
  - task_id
  - agent_definition_id
  - attempt_number
  - status
  - idempotency_key
  - resource_limits
  - workspace_id
properties:
  session_id:
    type: string
    format: uuid
    description: "Unique session identifier"

  idempotency_key:
    type: string
    description: "Typically SHA256(task_id + attempt_number)"
  
  task_id:
    type: string
    format: uuid
    description: "Parent task identifier"
  
  agent_definition_id:
    type: string
    format: uuid
    description: "Agent executing in this session"

  matching_decision_id:
    type: string
    format: uuid
    description: "MatchingDecision that selected this agent"
  
  attempt_number:
    type: integer
    minimum: 1
    description: "Attempt number (1-indexed)"
  
  previous_session_id:
    type: string
    format: uuid
    description: "Previous session ID (for retry chain)"
  
  # Status excludes compensating (WorkflowInstance concern on durable_effects).
  # Status excludes Correcting/Escalated (Task-owned; each retry = new session).
  # After validating, terminal is succeeded|failed|cancelled only — never re-enter running.
  # CostLease revocation → cancelled with last_failure_category=budget_exceeded.
  # Status enum: no compensating, Correcting, or Escalated.
  # Retry never re-enters running on the same session — always a new AgentSession.
  status:
    $ref: "../shared-enums.schema.yaml#/$defs/AgentSessionStatus"
  
  # Required: every session owns exactly one workspace for its lifetime.
  # Session create MUST be atomic with workspace creation.
  workspace_id:
    type: string
    format: uuid
    description: "Exclusive workspace for this session (Task 1 → * Workspace via sessions)"
  
  sandbox_id:
    type: string
    format: uuid

  sandbox_attestation_id:
    type: string
    format: uuid
    description: "SandboxAttestation recorded at session start"
  
  compiled_prompt_id:
    type: string
    format: uuid
    description: "Reference to CompiledPrompt artifact"

  cost_lease_id:
    type: string
    format: uuid
    description: "CostLease reference for synchronous hard kill on budget breach"

  # P0-COSTLEASE-RACE: Atomic lease check for session completion guard.
  # Must match CostLease.lease_revision for any transition from running to succeeded.
  # Mismatch forces cancellation — prevents session completion between revocation and observation.
  # Updated by sidecar on each lease check tick; Execution validates before terminal transition.
  lease_check_revision:
    type: integer
    minimum: 0
    description: >
      Last observed CostLease.lease_revision. Execution MUST verify
      lease_check_revision == CostLease.lease_revision before transitioning
      from running/validating to succeeded. Mismatch → cancel with budget_exceeded.

  # Hard resource ceilings (structurally enforced)
  resource_limits:
    type: object
    minProperties: 1
    required: [timeout_seconds]
    properties:
      max_tokens:
        type: integer
        minimum: 1
      max_usd:
        type: number
        minimum: 0
      timeout_seconds:
        type: integer
        minimum: 1
    anyOf:
      - required: [max_tokens]
      - required: [max_usd]
  
  # --- Aggregate invariant (anti–God Object): P0-AGENTSESSION-GOD ---
  # AgentSession retains ONLY: identity, status, references, replay metadata, timestamps.
  # Full histories live in their own tables/streams:
  #   checkpoints  → checkpoints table + AgentSession.Checkpoint events
  #   tool_calls   → tool_call_events stream + AgentSession.ToolCall events
  #   resource_usage history → CostRecord + Cost.Recorded events (NOT here)
  #   validation   → ValidationResult table (validation_result_id only)
  #   feedback     → Feedback table (feedback_artifact_id only)
  # Ring buffers (recent_checkpoint_ids, recent_tool_call_ids) are REMOVED — query
  # linked tables ordered by sequence. event_retention is REMOVED — configured at
  # deployment level, not per-session. resource_usage is REMOVED — live metering
  # lives on CostRecord; CostLease synchronous check reads from CostEnforcer state.

  # Interactive prompt handling (CLI agents that request input)
  pending_input:
    type: object
    description: "Present when status=waiting_for_input"
    properties:
      prompt_text:
        type: string
      input_kind:
        type: string
        enum: [clarification, approval, secret, choice, freeform]
      auto_response_rule:
        type: string
        description: "Matched auto-response rule id, if any"
      timeout_seconds:
        type: integer
        minimum: 1
        description: >
          When expired without respond_input: emit EscalationSignal
          (escalation_type depends on input_kind; default manual_trigger),
          set input_timeout_reason, transition toward failed/cancelled per policy
      input_timeout_reason:
        type: string
        enum: [operator_timeout, auto_response_miss, policy_deny, deadline_exceeded]
        description: "Set when waiting_for_input times out"
      escalation_signal_id:
        type: string
        format: uuid
        description: "EscalationSignal created on input timeout (if escalated)"
      on_timeout:
        type: string
        enum: [escalate, cancel, fail]
        default: escalate
        description: "Policy when timeout_seconds elapses without input"
  
  # References only — never embed full ValidationResult or Feedback
  validation_result_id:
    type: string
    format: uuid
    description: "Reference to standalone ValidationResult contract"

  feedback_artifact_id:
    type: string
    format: uuid
    description: "Reference to Feedback artifact (if retry path produced one)"
  
  cost_record_id:
    type: string
    format: uuid
    description: "Authoritative CostRecord in Observability Context"

  # Failure attribution for retry eligibility (set on terminal failure/cancel)
  last_failure_category:
    $ref: "../shared-enums.schema.yaml#/$defs/TerminalFailureCategory"
    description: >
      Terminal failure category (shared with Task.retry_state).
      CostLease revocation MUST set budget_exceeded and status=cancelled (not failed).
      Validator categories behavioral/test_execution are valid here for retry eligibility.
  
  replay_metadata:
    $ref: "replay-metadata.schema.yaml"

  # Replay / recovery status when event store is incomplete
  replay_status:
    type: string
    enum: [complete, replay_incomplete, not_applicable]
    default: not_applicable
    description: >
      complete = full event history available for reconstruction;
      replay_incomplete = older events missing — operator intervention required;
      not_applicable = session still live / not under replay.
  
  started_at:
    type: string
    format: date-time
  
  completed_at:
    type: string
    format: date-time

# cost_lease_id required when session is actively consuming budget
allOf:
  - if:
      properties:
        status:
          enum: [starting, running, waiting_for_input, producing_artifact, validating]
    then:
      required: [cost_lease_id]
  # Terminal states should record failure category when failed/cancelled/timed_out
  - if:
      properties:
        status:
          enum: [failed, cancelled, timed_out]
    then:
      required: [last_failure_category]
  - if:
      properties:
        status:
          const: waiting_for_input
    then:
      required: [pending_input]
  # P0-COSTLEASE-RACE: succeeded requires lease_check_revision (atomic lease check guard)
  - if:
      properties:
        status:
          const: succeeded
    then:
      required: [lease_check_revision]
      description: >
        lease_check_revision must be set before succeeded transition.
        Execution validates lease_check_revision == CostLease.lease_revision;
        mismatch forces cancellation with budget_exceeded.
