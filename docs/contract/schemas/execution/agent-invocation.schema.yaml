# Agent Invocation Request Schema
# Request DTO that creates an AgentSession. AgentSession is the durable aggregate;
# this schema is the immutable request boundary into the runtime.

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [task_id, agent_definition_id, contract, workspace, idempotency_key, resource_limits]
properties:
  # References
  task_id:
    type: string
    format: uuid
    description: "Parent task identifier"

  agent_definition_id:
    type: string
    format: uuid
    description: "Agent to invoke"

  matching_decision_id:
    type: string
    format: uuid
    description: "MatchingDecision that authorized this assignment"

  # Idempotency
  idempotency_key:
    type: string
    description: "Unique key for idempotent execution (typically SHA256(task_id + attempt_number))"

  # Session chain (for retries)
  attempt_number:
    type: integer
    minimum: 1
    default: 1
    description: "Current attempt number (1-indexed)"

  previous_session_id:
    type: string
    format: uuid
    description: "Previous session ID (for retry chain)"

  # Contract to execute
  contract:
    type: object
    required: [type, version, data]
    properties:
      type:
        type: string
        description: "Contract type (e.g., 'CodeChangeArtifact')"
      version:
        type: string
        description: "Required contract version"
      data:
        type: object
        description: "Contract input data"

  # Expected output contract
  expected_output_contract:
    type: object
    required: [type, version]
    properties:
      type:
        type: string
        description: "Expected artifact contract type"
      version:
        type: string
        description: "Expected contract version"

  # Output mode — Amir owns extraction; free_text is not a control-plane mode
  output_mode:
    type: string
    enum: [json_schema, tool_use, markdown_yaml, workspace_observation]
    description: "How Amir will extract the artifact (control plane decides, not the agent)"

  # Feedback from previous attempt
  feedback:
    $ref: "../artifact/feedback.schema.yaml"

  # Workspace configuration (new workspace per attempt)
  workspace:
    type: object
    required: [repo_url, branch, workdir]
    properties:
      repo_url:
        type: string
        format: uri
        description: "Git repository URL"
      branch:
        type: string
        description: "Branch to work on (will be created if needed)"
      workdir:
        type: string
        description: "Working directory in sandbox"

  # Resource constraints — at least one cost ceiling required
  resource_limits:
    type: object
    minProperties: 1
    required: [timeout_seconds]
    properties:
      max_tokens:
        type: integer
        minimum: 1
        description: "Maximum tokens to consume (hard limit)"
      max_usd:
        type: number
        minimum: 0
        description: "Maximum USD cost (hard limit)"
      timeout_seconds:
        type: integer
        minimum: 1
        description: "Execution timeout in seconds"
    anyOf:
      - required: [max_tokens]
      - required: [max_usd]

  # Replay metadata — SEED payload only (not the full session shape).
  # During AgentSession initialization, Execution expands this into the full
  # replay-metadata.schema.yaml object by adding session_id, prompt_hash,
  # full_prompt, sandbox_profile_hash, adapter_type, tool_call_stream_ref.
  # Do NOT pass this object unmodified as AgentSession.replay_metadata.
  replay_metadata:
    type: object
    description: >
      Seed fields known at invocation time. Expanded to full
      replay-metadata.schema.yaml during session start (see agent.md).
    properties:
      model_identifier:
        type: string
      seed:
        type: integer
      agent_version:
        type: string
