# Shared Enumerations
# Single source of truth for cross-schema vocabularies.
# Other schemas MUST $ref these definitions rather than re-declaring enums.
#
# Failure category mapping (validator → session/task terminal):
#   behavioral      → may map at boundary to quality (or stored as behavioral)
#   test_execution  → may map at boundary to quality (or stored as test_execution)
# TerminalFailureCategory is the full set used by AgentSession/Task for retry eligibility.
# ValidatorFailureCategory is the set used by ValidationResult/Feedback error_categories.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "amir://contract/schemas/shared-enums"

$defs:
  # Full union of failure categories across validation + terminal session/task.
  FailureCategory:
    type: string
    enum:
      - structural
      - semantic
      - policy
      - quality
      - timeout
      - infrastructure
      - cancelled
      - budget_exceeded
      - circuit_breaker_open
      - behavioral
      - test_execution
    description: >
      Shared failure / error category vocabulary.
      Validator-only categories (behavioral, test_execution) are valid on
      ValidationResult and as TerminalFailureCategory for retry eligibility.

  # Categories that may appear on ValidationResult / Feedback (no cancelled/circuit)
  ValidatorFailureCategory:
    type: string
    enum:
      - structural
      - semantic
      - policy
      - quality
      - behavioral
      - test_execution
      - timeout
      - infrastructure
      - budget_exceeded
    description: "ValidationResult.error_categories and Feedback.validation_errors"

  # Terminal failure on AgentSession / Task.retry_state (retry eligibility input)
  TerminalFailureCategory:
    type: string
    enum:
      - structural
      - semantic
      - policy
      - quality
      - timeout
      - infrastructure
      - cancelled
      - budget_exceeded
      - circuit_breaker_open
      - behavioral
      - test_execution
    description: >
      last_failure_category on AgentSession and Task.
      When a validator emits behavioral/test_execution, Execution stores that
      category (or maps to quality) before evaluating Task.retry_policy.retry_on.

  # Default Task.retry_policy.retry_on (excludes budget_exceeded, cancelled, circuit_breaker_open)
  RetryableFailureCategory:
    type: string
    enum:
      - structural
      - semantic
      - policy
      - quality
      - timeout
      - infrastructure
      - behavioral
      - test_execution
    description: >
      Default Task.retry_policy.retry_on set.
      budget_exceeded / cancelled / circuit_breaker_open excluded by default (escalate).

  ObservationMethod:
    type: string
    enum: [workspace_diff, parser_extracted, agent_claims, synthesized]
    description: "How an artifact was derived relative to workspace ground truth"

  ParserStrategy:
    type: string
    enum:
      - structured_output
      - tool_call_interception
      - markdown_block
      - workspace_observation
      - llm_coercion
    description: "ParserRegistry strategy identifiers"

  # Parser strategies allowed for feedback hints (excludes llm_coercion which requires Approval)
  FeedbackStrategy:
    type: string
    enum:
      - structured_output
      - tool_call_interception
      - markdown_block
      - workspace_observation
    description: "Parser strategies allowed as feedback hints (llm_coercion requires Approval, not hints)"

  OutputMode:
    type: string
    enum: [json_schema, tool_use, markdown_yaml, workspace_observation]
    description: "Agent/control-plane extraction modes (map to ParserStrategy)"

  BudgetPool:
    type: string
    enum: [execution, validation, compensation, orchestration]
    description: >
      Cost attribution pool for CostRecord. execution/validation are lease-gated
      (synchronous hard-kill via CostLease). compensation/orchestration are
      attribution-only (no lease, no hard-kill path — recorded for rollup only).
      For CostLease budget_pool, use CostLeaseBudgetPool (execution/validation only).

  CostLeaseBudgetPool:
    type: string
    enum: [execution, validation]
    description: >
      Pools that use synchronous CostLease hard-kill. compensation and orchestration
      costs are NOT lease-gated; they are recorded on CostRecord with BudgetPool only.

  CostLeaseStatus:
    type: string
    enum: [active, revoked, expired, released]

  CostLeaseScope:
    type: string
    enum: [invocation, team, tenant, org]

  CancellationReason:
    type: string
    enum:
      - invocation_budget_exceeded
      - team_budget_exceeded
      - tenant_budget_exceeded
      - org_budget_exceeded
      - validation_budget_exceeded
      - session_timeout
      - manual_revocation
      - heartbeat_timeout
    description: >
      heartbeat_timeout: agent sidecar failed to send heartbeat within
      heartbeat_timeout_seconds; lease auto-revoked (P0-COSTENFORCER-HEARTBEAT).

  NetworkMode:
    type: string
    enum: [proxy, none]

  SandboxRuntime:
    type: string
    enum: [gvisor, firecracker, docker]

  ProductionSandboxRuntime:
    type: string
    enum: [gvisor, firecracker]

  AgentSessionStatus:
    type: string
    enum:
      - pending
      - starting
      - running
      - waiting_for_input
      - producing_artifact
      - validating
      - succeeded
      - failed
      - timed_out
      - cancelled
    description: >
      No compensating (Workflow-owned). No Correcting/Escalated (Task-owned).
      Each retry attempt is a new session; status never re-enters running after validating.

  TaskStatus:
    type: string
    enum:
      - pending
      - assigned
      - running
      - committing
      - succeeded
      - failed
      - cancelled
      - escalated
    description: >
      Success terminal is succeeded (not completed).
      Event Task.Completed maps to status=succeeded.
      committing (renamed from validating — P0-TASKVALIDATING): post-session-terminal
      phase where cost lease is committed, scorecard updated, and workspace observation
      finalized. Distinct from AgentSession.status=validating (which is OutputParser running).
      Escalation is Task.status=escalated + EscalationSignal (not a session status).

  ApprovalStatus:
    type: string
    enum: [pending, auto_approved, granted, rejected, expired, cancelled]

  CompensationConcreteEffect:
    type: string
    enum:
      - git_revert
      - branch_delete
      - pr_close
      - artifact_delete
      - resource_cleanup
      - revoke_access_token
      - send_notification

  CompensationAbstractIntent:
    type: string
    enum:
      - rollback_workspace_effects
      - delete_artifacts
      - revoke_access
      - notify
      - custom
