# Task Contract Schema
# Contract for task definition and execution

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [title, objective, assigned_role]
properties:
  # Core identity
  title:
    type: string
    description: "Human-readable task title"
    maxLength: 200
  
  objective:
    type: string
    description: "Natural language objective"
    minLength: 1
  
  description:
    type: string
    description: "Detailed task description"
  
  # Role assignment
  assigned_role:
    type: string
    description: "Role to perform this task"
  
  # Input artifacts
  inputs:
    type: array
    items:
      type: string
      format: uuid
    description: "Artifact IDs to provide as input"
  
  # Expected outputs
  expected_outputs:
    type: array
    items:
      type: string
    description: "Expected artifact contract types"
  
  # Constraints
  constraints:
    type: object
    description: "Rules for execution"
    properties:
      follow_solid:
        type: boolean
        default: true
      max_file_changes:
        type: integer
        minimum: 1
      excluded_paths:
        type: array
        items:
          type: string
  
  # Dependencies
  depends_on:
    type: array
    items:
      type: string
      format: uuid
  
  # Priority
  priority:
    type: string
    enum: [critical, high, normal, low, background]
    default: "normal"
  
  # Cost controls (at least one required)
  cost_budget:
    type: object
    properties:
      max_tokens:
        type: integer
        minimum: 1
      max_usd:
        type: number
        minimum: 0