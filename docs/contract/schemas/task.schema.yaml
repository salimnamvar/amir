# Task Contract Schema
# Contract for task definition and execution
# Updated: Added idempotency key and circuit breaker

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [title, objective, assigned_role, idempotency_key]
properties:
  # Core identity
  id:
    type: string
    format: uuid
    description: "Task identifier"
  
  idempotency_key:
    type: string
    description: "Unique key for idempotent task creation"
  
  title:
    type: string
    description: "Human-readable task title"
    maxLength: 200
  
  objective:
    type: string
    description: "Natural language objective"
    minLength: 1
  
  description:
    type: string
    description: "Detailed task description"
  
  # Role assignment
  assigned_role:
    type: string
    description: "Role to perform this task"
  
  # Input artifacts
  inputs:
    type: array
    items:
      type: string
      format: uuid
    description: "Artifact IDs to provide as input"
  
  # Expected outputs (typed contract references)
  expected_outputs:
    type: array
    items:
      type: object
      required: [type, version]
      properties:
        type:
          type: string
          description: "Expected artifact contract type"
        version:
          type: string
          description: "Expected contract version"
    description: "Expected artifact contract types with versions"
  
  # Constraints
  constraints:
    type: object
    description: "Rules for execution"
    properties:
      follow_solid:
        type: boolean
        default: true
      max_file_changes:
        type: integer
        minimum: 1
      excluded_paths:
        type: array
        items:
          type: string
  
  # Dependencies
  depends_on:
    type: array
    items:
      type: string
      format: uuid
  
  # Priority
  priority:
    type: string
    enum: [critical, high, normal, low, background]
    default: "normal"
  
  # Cost controls
  cost_budget:
    type: object
    properties:
      max_tokens:
        type: integer
        minimum: 1
      max_usd:
        type: number
        minimum: 0
  
  # Retry policy
  retry_policy:
    type: object
    properties:
      max_attempts:
        type: integer
        minimum: 1
        default: 3
      backoff_seconds:
        type: integer
        minimum: 1
        default: 60
      backoff_strategy:
        type: string
        enum: [exponential, linear, fixed]
        default: "exponential"
      retry_on:
        type: array
        items:
          type: string
        default: ["FAILED", "TIMEOUT"]
      escalate_after:
        type: integer
        minimum: 1
        default: 2
        description: "Escalate to different agent after N failures"
  
  # Circuit breaker
  circuit_breaker:
    type: object
    properties:
      state:
        type: string
        enum: [closed, open, half_open]
        default: "closed"
      consecutive_failures:
        type: integer
        default: 0
      failure_threshold:
        type: integer
        default: 5
      recovery_timeout_seconds:
        type: integer
        default: 300
