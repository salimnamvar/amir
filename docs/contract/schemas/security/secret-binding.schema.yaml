# SecretBinding Contract Schema
# Ephemeral secret grants with TTL for secure secret injection into sandboxes
# Consumption proof required when single_use=true

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required:
  - binding_id
  - task_id
  - secret_name
  - injected_at
  - expires_at
  - status
  - idempotency_key
properties:
  binding_id:
    type: string
    format: uuid
    description: "Unique secret binding identifier"

  idempotency_key:
    type: string
    description: "Idempotency key for secret injection"

  task_id:
    type: string
    format: uuid
    description: "Task this secret binding belongs to"

  session_id:
    type: string
    format: uuid
    description: "AgentSession this secret injection is valid for (if created)"

  sandbox_attestation_id:
    type: string
    format: uuid
    description: "SandboxAttestation verified before secret injection (required for production)"

  secrets_hash:
    type: string
    description: "Hash of secret names/refs injected (not secret values) for attestation binding"

  secret_name:
    type: string
    description: "Name of the secret as referenced in policies"

  secret_ref:
    type: string
    description: "Internal reference to secret in vault (e.g., kms:// or vault://)"

  injected_at:
    type: string
    format: date-time
    description: "When secret was injected into sandbox"

  valid_from:
    type: string
    format: date-time
    description: "Earliest time secret may be used"

  expires_at:
    type: string
    format: date-time
    description: "TTL-based expiration for automatic cleanup (valid_to)"

  access_method:
    type: string
    enum: [env, file, proxy]
    description: "How secret is accessed in sandbox: env var, tmpfs file, or proxy-forwarded"

  access_path:
    type: string
    description: "Path or env var name for secret access (e.g., /secrets/token or GITHUB_TOKEN)"

  # One-time use flag for sensitive operations
  single_use:
    type: boolean
    default: false
    description: "Secret invalidated after first read; requires consumption proof"

  status:
    type: string
    enum: [active, used, expired, revoked]
    default: "active"
    description: "Current lifecycle state of this binding"

  # Consumption proof (required path when single_use transitions to used)
  consumed_at:
    type: string
    format: date-time
    description: "When secret was first consumed"

  consumer_session_id:
    type: string
    format: uuid
    description: "Session that consumed the secret"

  consumption_signature:
    type: string
    description: "Signature over consumption claim (prevents replay of used status)"

  consumer_pubkey_ref:
    type: string
    description: "Public key ref used to verify consumption_signature"

  created_by:
    type: string
    description: "Principal that created this binding"

  revoked_at:
    type: string
    format: date-time
    description: "When secret was revoked (if applicable)"

# When single_use and status=used, consumption proof fields required
allOf:
  - if:
      properties:
        single_use:
          const: true
        status:
          const: used
    then:
      required: [consumed_at, consumer_session_id, consumption_signature]
