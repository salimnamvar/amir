# Sandbox Contract Schema
# Complete schema for sandbox configuration
# Updated: Mandatory gVisor, egress proxy, attestation
# P0 fix: environment is required (JSON Schema default is not a validation keyword;
# omitting environment previously allowed docker to pass structural validation).

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [runtime, network_mode, environment]
properties:
  # Runtime type (gVisor mandatory in production)
  runtime:
    type: string
    enum: [gvisor, firecracker, docker]
    description: "Sandbox runtime type (gvisor default for production)"
    default: "gvisor"
  
  # User and filesystem security
  user:
    type: integer
    description: "UID to run as (default: 65534 = nobody)"
    default: 65534
  
  read_only_root:
    type: boolean
    default: true
    description: "Root filesystem is read-only (MUST be true)"
  
  tmpfs_workspaces:
    type: boolean
    default: true
    description: "Workspaces mounted as tmpfs"
  
  # Network configuration (host mode REMOVED)
  # Default posture: proxy mode with deny-by-default allowlist.
  # Empty allowlist means deny all destinations except platform-managed LLM routes
  # injected by the egress proxy for cost attribution.
  network_mode:
    $ref: "../shared-enums.schema.yaml#/$defs/NetworkMode"
    default: "proxy"
    description: >
      proxy = all outbound via Amir egress proxy (required for LLM agents);
      none = no network (offline tools only; incompatible with cloud LLM CLIs)

  network_allowlist:
    type: array
    items:
      type: string
    default: []
    description: >
      Allowed destinations (hostname, domain, or CIDR). Default empty = deny-all
      except platform LLM provider routes. For coding agents, include package
      registries required by the task (pypi.org, registry.npmjs.org, proxy.golang.org, etc.).
  
  network_allowlist_profile:
    type: string
    enum: [llm_only, coding_standard, container_build, custom]
    default: coding_standard
    description: "Preset expanded before enforcement; custom uses network_allowlist only"
  
  # Production constraint: docker runtime is invalid when environment=production.
  # REQUIRED so the root-level if/then always evaluates; default alone is not validation.
  environment:
    type: string
    enum: [development, staging, production]
    description: "Deployment environment (required). docker only valid in development/staging."
  
  # Resource limits
  resource_limits:
    type: object
    properties:
      cpus:
        type: number
        minimum: 0.1
      memory:
        type: string
        pattern: "^[0-9]+[kmg]?$"
      pids_limit:
        type: integer
        minimum: 1
      # P1-RESOURCE-LIMITS: additional resource constraints
      memory_limit_mb:
        type: integer
        minimum: 64
        description: "Hard memory limit in MB (prevents resource exhaustion attacks)"
      max_concurrent_sessions:
        type: integer
        minimum: 1
        default: 1
        description: "Maximum concurrent AgentSessions in this sandbox"
      egress_rate_limit_bps:
        type: integer
        minimum: 1
        description: "Network egress rate limit in bits per second"
  
  # Security profile
  security_profile:
    type: string
    enum: [baseline, hardened]
    default: "baseline"
    description: "Security profile preset"
  
  # Runtime attestation
  attestation:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      signing_key_ref:
        type: string
        description: "Reference to signing key for attestation"
      image_verification:
        type: boolean
        default: true
        description: "Verify container image signature"

# Structural enforcement: docker runtime is illegal when environment is production.
# if/then MUST be at schema root, not under properties.
# environment is in required[] so the if condition always has a value to match.
if:
  properties:
    environment:
      const: production
then:
  properties:
    runtime:
      enum: [gvisor, firecracker]
      description: "Production mandates gVisor or Firecracker; docker is structurally illegal"
