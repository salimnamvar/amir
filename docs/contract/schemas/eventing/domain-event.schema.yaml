# DomainEvent Contract Schema
# Immutable envelope for all domain and audit-relevant events
#
# Hash chain (linear, per aggregate): events for a given aggregate_id form a
# linear hash chain (not a Merkle tree). Single-writer per aggregate is required —
# serialize outbox inserts via row-level lock on the aggregate or partition by
# aggregate_id. Root events set causation_id null and prev_hash null/empty.

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required:
  - event_id
  - event_type
  - aggregate_id
  - aggregate_type
  - correlation_id
  - producer
  - timestamp
  - payload
  - sequence
properties:
  event_id:
    type: string
    format: uuid
  event_type:
    type: string
    description: "e.g. Task.Created, AgentSession.Completed, Cost.BudgetExceeded"
  aggregate_id:
    type: string
    format: uuid
  aggregate_type:
    type: string
  correlation_id:
    type: string
    format: uuid
    description: "Workflow / request correlation for distributed tracing"
  causation_id:
    type: ["string", "null"]
    format: uuid
    description: "ID of the event that caused this one; null for root events"
  producer:
    type: string
    description: "Component that emitted the event"
  version:
    type: string
    default: "1.0.0"
  timestamp:
    type: string
    format: date-time
  payload:
    type: object
    description: "Event-type-specific body"

  # P0-DOMAINPAYLOAD: per-event-type payload schema enforcement
  payload_schema_ref:
    type: string
    description: >
      $ref to per-event-type payload schema under schemas/eventing/payloads/.
      CI must validate that no event is emitted without a registered payload schema.
      Example: amir://contract/schemas/eventing/payloads/task-created.schema.yaml
      The referenced schema defines the exact shape of this event's payload.
  signature:
    type: string
    description: "Cryptographic signature over event material"
  sequence:
    type: integer
    minimum: 0
    description: "Monotonic sequence within the linear hash chain scope (per aggregate_id)"

  prev_hash:
    type: ["string", "null"]
    description: >
      SHA256 of previous event in the linear hash chain for this aggregate_id.
      null for the first event in the chain. Required for sequence > 0 at write time.

  algorithm:
    type: string
    description: "Signature algorithm (e.g. Ed25519, ECDSA-P256)"

  key_ref:
    type: string
    description: "Signing key reference (KMS/HSM)"

  traceparent:
    type: string
    description: "W3C trace context (format: 00-{trace-id}-{span-id}-{flags})"
    pattern: "^([0-9a-f]{2})-([0-9a-f]{32})-([0-9a-f]{16})-([0-9a-f]{2})$"

  tracestate:
    type: string
    description: "W3C tracestate header value"

# Linear hash chain enforcement: prev_hash required when sequence > 0
allOf:
  - if:
      properties:
        sequence:
          minimum: 1
      required: [sequence]
    then:
      required: [prev_hash]
      properties:
        prev_hash:
          type: string
          minLength: 1
          description: "P1-HASH-CHAIN-BOTTLENECK: must be non-null SHA256 when sequence > 0"
