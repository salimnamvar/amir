# DomainEvent Contract Schema
# Immutable envelope for all domain and audit-relevant events

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required:
  - event_id
  - event_type
  - aggregate_id
  - aggregate_type
  - correlation_id
  - causation_id
  - producer
  - timestamp
  - payload
properties:
  event_id:
    type: string
    format: uuid
  event_type:
    type: string
    description: "e.g. Task.Created, AgentSession.Completed, Cost.BudgetExceeded"
  aggregate_id:
    type: string
    format: uuid
  aggregate_type:
    type: string
  correlation_id:
    type: string
    format: uuid
    description: "Workflow / request correlation for distributed tracing"
  causation_id:
    type: string
    format: uuid
    description: "ID of the event that caused this one"
  producer:
    type: string
    description: "Component that emitted the event"
  version:
    type: string
    default: "1.0.0"
  timestamp:
    type: string
    format: date-time
  payload:
    type: object
    description: "Event-type-specific body"
  signature:
    type: string
    description: "Cryptographic signature over event material"
  sequence:
    type: integer
    minimum: 0
    description: "Monotonic sequence within the hash chain scope"
  prev_hash:
    type: string
    description: "SHA256 of previous event in the Merkle chain"
  algorithm:
    type: string
    description: "Signature algorithm (e.g. Ed25519, ECDSA-P256)"
  key_ref:
    type: string
    description: "Signing key reference (KMS/HSM)"
  traceparent:
    type: string
    description: "W3C trace context"
  tracestate:
    type: string
