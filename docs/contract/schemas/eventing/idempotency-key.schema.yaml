# IdempotencyKey Contract Schema
# Outcome store for idempotent mutable operations
# Required for: Task, AgentSession, Artifact, Workflow, Approval, CostLease,
# MatchingDecision, EscalationSignal, SecretBinding, CompensationAction
#
# P1-IDEMPOTENCY-SCOPE: Scope-to-operation mapping:
#   global   = cross-tenant uniqueness (rare; e.g., platform-wide config changes)
#   tenant   = unique within tenant (e.g., tenant.create)
#   team     = unique within team (e.g., task.create, session.create)
#   task     = unique within task (e.g., validation.run, feedback.submit)
#   agent    = unique within agent (e.g., agent.heartbeat, agent.health)
# Retention: keys expire after expires_at (default 30 days). DDL enforces UNIQUE(key, scope).

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [key, operation_type, scope, created_at]
properties:
  key:
    type: string
    description: "Opaque idempotency key (e.g. SHA256 of natural key material)"
  operation_type:
    type: string
    enum:
      - task.create
      - session.create
      - lease.reserve
      - lease.heartbeat
      - lease.commit
      - lease.revoke
      - workflow.start
      - approval.request
      - approval.grant
      - artifact.submit
      - compensation.execute
      - escalation.create
      - secret.inject
      - matching.decide
    description: "P1-IDEMPOTENCY-SCOPE: exhaustive list of mutable operation types"
  scope:
    type: string
    enum: [global, tenant, team, task, agent]
    default: global
    description: "Collision scope; keys are unique within scope. See scope-to-operation mapping in header."
  outcome:
    type: object
    description: "Serialized successful result for replay on duplicate request"
  created_at:
    type: string
    format: date-time
  expires_at:
    type: string
    format: date-time
    description: "Key TTL (default 30 days). Expired keys are eligible for garbage collection."
