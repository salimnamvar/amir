# Cost Record Schema
# Multi-dimensional cost tracking with orchestration/worker separation
# Supports 4-level hierarchy: invocation → team → tenant → org

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [id, task_id, agent_session_id, team_id, tokens_total, cost_usd, budget_pool]
properties:
  id:
    type: string
    format: uuid
  
  task_id:
    type: string
    format: uuid
  
  agent_session_id:
    type: string
    format: uuid
  
  agent_definition_id:
    type: string
    format: uuid
  
  team_id:
    type: string
    format: uuid

  tenant_id:
    type: string
    format: uuid
    description: "Tenant for 4-level cost hierarchy rollup"

  org_id:
    type: string
    format: uuid
    description: "Org for 4-level cost hierarchy rollup"

  # Which budget pool was charged
  # execution/validation: gated by CostLease; compensation/orchestration: attribution only
  budget_pool:
    type: string
    enum: [execution, validation, compensation, orchestration]
    description: >
      Cost attribution pool. validation spend never charges execution lease.
      compensation and orchestration are not lease-gated (no hard-kill path);
      they are recorded for rollup only.
  
  # Consumption
  tokens_input:
    type: integer
    minimum: 0
    default: 0
  
  tokens_output:
    type: integer
    minimum: 0
    default: 0
  
  tokens_total:
    type: integer
    minimum: 0
  
  cost_usd:
    type: number
    minimum: 0
  
  # Attribution
  orchestration_cost_usd:
    type: number
    minimum: 0
    default: 0
    description: "Amir platform overhead cost"
  
  worker_cost_usd:
    type: number
    minimum: 0
    description: "Agent/LLM provider cost"

  validation_cost_usd:
    type: number
    minimum: 0
    default: 0
    description: "Validation-pipeline spend (when budget_pool=validation)"
  
  # Timing
  duration_seconds:
    type: number
    minimum: 0
  
  started_at:
    type: string
    format: date-time
  
  completed_at:
    type: string
    format: date-time
  
  # Context
  contract_type:
    type: string
  
  workflow_instance_id:
    type: string
    format: uuid
  
  step_index:
    type: integer
  
  # Metadata
  model_identifier:
    type: string
    description: "LLM model used"
  
  parser_strategy_used:
    type: string
    enum: [structured_output, tool_call_interception, markdown_block, workspace_observation, llm_coercion]
    description: "Parser strategy that succeeded"
  
  retry_count:
    type: integer
    minimum: 0
    default: 0
