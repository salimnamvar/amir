# CostLease Contract Schema
# Synchronous cost lease / shared-state gate for in-flight session cancellation
# Enables immediate cancellation when team/tenant/org limits are breached
#
# Kill protocol (normative):
# 1. Observability marks lease status=revoked with revocation_revision + cancellation_reason.
# 2. Sidecar/egress observes revoked status on next ≤100ms tick (or sooner via push).
# 3. P0-KILL-BOUND: Sidecar MUST NOT directly signal the sandbox process. Instead, sidecar
#    signals AgentExecutor (or AgentAdapter), which holds sole process-signaling responsibility.
# 4. AgentAdapter.cancel(handle, cancellation_reason, grace_period_seconds=5) → SIGTERM→SIGKILL.
#    P0-KILL-BOUND: grace_period_seconds max is 5s (reduced from 30s). cancel_acknowledged=false
#    triggers immediate SIGKILL with no additional grace.
# 5. AgentExecutor observes process exit, transitions AgentSession to cancelled with
#    last_failure_category=budget_exceeded, then Workflow runs compensation on durable_effects.
# 6. Durable effects are appended as created (not only at session completion).
# P0-KILL-BOUND: Total kill chain is bounded at total_kill_latency_ms (default 7s, max 10s).
# Worst case: 100ms tick + 5s grace + 2s SIGKILL/reap = 7.1s.
#
# Hierarchical cascade model (normative — single-lease-per-session):
# - Each in-flight session holds ONE active CostLease with scope=invocation
#   (budget_pool=execution or validation). Parent budgets are running totals in Observability.
# - On team/tenant/org hard breach: CostEnforcer.revoke_by_scope(scope, scope_id, reason)
#   revokes ALL active leases attributed to that scope (team_id/tenant_id/org_id match).
# - There is no parallel cancelled boolean — status=revoked is the sole kill signal.
# - Soft/hard percentage thresholds for parent budgets are ops policy on Team.budget /
#   CostSummary; defaults 80% soft / 100% hard are NOT schema fields on CostLease.

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required:
  - lease_id
  - task_id
  - reserved_usd
  - reserved_tokens
  - status
  - budget_pool
  - scope
  - idempotency_key
  - lease_revision
properties:
  lease_id:
    type: string
    format: uuid
    description: "Unique lease identifier"

  idempotency_key:
    type: string
    description: "Idempotency key for lease reservation (required for all mutable ops)"

  task_id:
    type: string
    format: uuid
    description: "Task this lease applies to"

  agent_session_id:
    type: string
    format: uuid
    description: "Current session holding this lease"

  # Which budget pool this lease meters (execution vs validation isolation).
  # Only execution and validation use synchronous CostLease gates.
  # CostRecord.budget_pool also allows compensation and orchestration for
  # attribution-only spend (not hard-killed via lease; no CostLease for those).
  budget_pool:
    $ref: "../shared-enums.schema.yaml#/$defs/CostLeaseBudgetPool"
    description: >
      execution = agent/worker spend; validation = validator/repair spend.
      Validation budget cannot be stolen by execution and vice versa.
      compensation/orchestration costs are recorded on CostRecord only (no lease).

  # Reservation amounts
  reserved_usd:
    type: number
    minimum: 0
    description: "USD reserved against budget (may include buffer)"

  reserved_tokens:
    type: integer
    minimum: 0
    description: "Tokens reserved against budget (may include buffer)"

  # Consumption tracking
  consumed_usd:
    type: number
    minimum: 0
    default: 0
    description: "USD consumed so far"

  consumed_tokens:
    type: integer
    minimum: 0
    default: 0
    description: "Tokens consumed so far"

  # Soft-kill threshold: process termination triggered at this % of reserved limit
  kill_threshold_pct:
    type: number
    minimum: 50
    maximum: 100
    default: 95
    description: >
      Percentage of reserved_usd/reserved_tokens at which the lease is revoked.
      Default 95 leaves headroom for in-flight tool completion before hard ceiling.

  # Monotonic revision for lease state changes (create/heartbeat/commit/revoke)
  lease_revision:
    type: integer
    minimum: 0
    description: "Monotonic revision; every mutation increments"

  revocation_revision:
    type: integer
    minimum: 0
    description: "Revision at which status became revoked; required when status=revoked"

  revocation_timestamp:
    type: string
    format: date-time
    description: "When the lease was revoked"

  # Sidecar must ACK revocation within this window or fail-closed
  sidecar_ack_deadline_ms:
    type: integer
    minimum: 100
    maximum: 30000
    default: 5000
    description: "Bounded window for sidecar to ACK lease revocation"

  # Time bounds
  created_at:
    type: string
    format: date-time

  expires_at:
    type: string
    format: date-time
    description: "Absolute expiry for this lease"

  # Lifecycle status (single source of truth — no separate cancelled boolean)
  # active → revoked (budget breach / manual) | expired | released (normal commit)
  status:
    $ref: "../shared-enums.schema.yaml#/$defs/CostLeaseStatus"
    default: "active"
    description: >
      Lease lifecycle. status=revoked is the SOLE cancellation signal (no cancelled flag).
      Execution MUST terminate the session (AgentSession.status=cancelled,
      last_failure_category=budget_exceeded).

  cancellation_reason:
    $ref: "../shared-enums.schema.yaml#/$defs/CancellationReason"
    description: "Why the lease was revoked (required when status=revoked)"

  # Whether a new attempt may retry after this revocation
  retryable:
    type: boolean
    description: >
      Computed from cancellation_reason: invocation_budget_exceeded and
      session_timeout may be retryable with a higher budget; team+/org scope
      and validation_budget_exceeded are not retryable by default (escalate).

  # Hierarchy attribution
  scope:
    $ref: "../shared-enums.schema.yaml#/$defs/CostLeaseScope"
    description: >
      Budget scope this lease enforces. Active session leases use scope=invocation.
      Parent breach uses revoke_by_scope which sets cancellation_reason to team+|tenant+|org+.

  team_id:
    type: string
    format: uuid

  tenant_id:
    type: string
    format: uuid

  org_id:
    type: string
    format: uuid

  # Failure modes (design contract for implementers)
  # - Lease check is synchronous on each sidecar/egress metering tick (≤100ms).
  # - status=revoked → Execution MUST terminate the session process via Adapter.cancel.
  # - Lease service unavailable → fail-closed: treat as revoked for new consumption
  #   (no further LLM egress); complete in-flight tool step only if already started.
  # - Post-cancel terminal category is budget_exceeded (not retryable by default;
  #   see Task.retry_policy.retry_on). Emits EscalationSignal when scope is team+.
  fail_closed_on_unavailable:
    type: boolean
    default: true
    description: "If lease service is unreachable, deny further metered consumption"

# Structural conditionals (lease protocol invariants)
allOf:
  # When revoked: reason + revision + timestamp required
  - if:
      properties:
        status:
          const: revoked
      required: [status]
    then:
      required: [cancellation_reason, revocation_revision, revocation_timestamp]
  # When not revoked: revocation fields must be absent
  - if:
      properties:
        status:
          enum: [active, expired, released]
      required: [status]
    then:
      not:
        anyOf:
          - required: [revocation_revision]
          - required: [revocation_timestamp]
  # Non-retryable reasons force retryable=false
  - if:
      properties:
        cancellation_reason:
          enum:
            - team_budget_exceeded
            - tenant_budget_exceeded
            - org_budget_exceeded
            - validation_budget_exceeded
            - manual_revocation
            - heartbeat_timeout
      required: [cancellation_reason]
    then:
      properties:
        retryable:
          const: false
  # Scope hierarchy IDs required by scope
  - if:
      properties:
        scope:
          const: team
      required: [scope]
    then:
      required: [team_id]
  - if:
      properties:
        scope:
          const: tenant
      required: [scope]
    then:
      required: [tenant_id]
  - if:
      properties:
        scope:
          const: org
      required: [scope]
    then:
      required: [org_id]
  # Active leases must bind a session (hard-kill needs a process)
  - if:
      properties:
        status:
          const: active
      required: [status]
    then:
      required: [agent_session_id]
  # cancellation_reason must be consistent with scope when scope is parent-level
  # Parent-level cascade reasons (team/tenant/org_budget_exceeded) require matching scope
  # to prevent invalid state where invocation lease has team-level reason
  - if:
      properties:
        cancellation_reason:
          const: team_budget_exceeded
      required: [cancellation_reason]
    then:
      properties:
        scope:
          const: team
      required: [team_id]
  - if:
      properties:
        cancellation_reason:
          const: tenant_budget_exceeded
      required: [cancellation_reason]
    then:
      properties:
        scope:
          const: tenant
      required: [tenant_id]
  - if:
      properties:
        cancellation_reason:
          const: org_budget_exceeded
      required: [cancellation_reason]
    then:
      properties:
        scope:
          const: org
      required: [org_id]
