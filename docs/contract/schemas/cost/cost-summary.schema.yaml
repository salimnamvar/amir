# CostSummary Contract Schema
# Aggregated cost by period / team / tenant / org / agent

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [period, total_usd]
properties:
  period:
    type: string
  team_id:
    type: string
    format: uuid
  tenant_id:
    type: string
    format: uuid
  org_id:
    type: string
    format: uuid
    description: "Org for 4-level cost hierarchy rollup"
  agent_definition_id:
    type: string
    format: uuid
  total_usd:
    type: number
    minimum: 0
  orchestration_cost_usd:
    type: number
    minimum: 0
  worker_cost_usd:
    type: number
    minimum: 0
  validation_cost_usd:
    type: number
    minimum: 0
  total_tokens:
    type: integer
    minimum: 0
  session_count:
    type: integer
    minimum: 0
