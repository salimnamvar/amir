# Sandbox Contract Schema
# Complete schema for sandbox configuration
# Updated: Mandatory gVisor, egress proxy, attestation

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [runtime, network_mode]
properties:
  # Runtime type (gVisor mandatory in production)
  runtime:
    type: string
    enum: [gvisor, firecracker, docker]
    description: "Sandbox runtime type (gvisor default for production)"
    default: "gvisor"
  
  # User and filesystem security
  user:
    type: integer
    description: "UID to run as (default: 65534 = nobody)"
    default: 65534
  
  read_only_root:
    type: boolean
    default: true
    description: "Root filesystem is read-only (MUST be true)"
  
  tmpfs_workspaces:
    type: boolean
    default: true
    description: "Workspaces mounted as tmpfs"
  
  # Network configuration (host mode REMOVED)
  network_mode:
    type: string
    enum: [proxy, none]
    default: "proxy"
    description: "Network access mode (all traffic through egress proxy)"
  
  network_allowlist:
    type: array
    items:
      type: string
    description: "Allowed network destinations (CIDR notation)"
  
  # Resource limits
  resource_limits:
    type: object
    properties:
      cpus:
        type: number
        minimum: 0.1
      memory:
        type: string
        pattern: "^[0-9]+[kmg]?$"
      pids_limit:
        type: integer
        minimum: 1
  
  # Security profile
  security_profile:
    type: string
    enum: [baseline, hardened]
    default: "baseline"
    description: "Security profile preset"
  
  # Runtime attestation
  attestation:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      signing_key_ref:
        type: string
        description: "Reference to signing key for attestation"
      image_verification:
        type: boolean
        default: true
        description: "Verify container image signature"
