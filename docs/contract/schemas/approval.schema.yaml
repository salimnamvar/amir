# Approval Contract Schema
# Complete schema for approval tracking

$schema: "https://json-schema.org/draft/2020-12/schema"

type: object
required: [workflow_id, gate_name, status]
properties:
  # References
  workflow_id:
    type: string
    format: uuid
  
  gate_name:
    type: string
    description: "Name of approval gate"
  
  # Approval status
  status:
    type: string
    enum: [pending, auto_approved, granted, rejected, expired]
    default: "pending"
  
  # Timing
  requested_at:
    type: string
    format: date-time
  
  responded_at:
    type: string
    format: date-time
  
  # Approver info
  approver_id:
    type: string
    description: "Who approved (empty for auto-approved)"
  
  # Gate configuration
  auto_approve:
    type: boolean
    default: true
    description: "Whether this gate auto-approves"
  
  timeout_seconds:
    type: integer
    minimum: 1
    default: 86400