# Agent Adapter Interface Contract
# Behavioral interface for external agent adapters (not a data entity)
#
# Process-supervision contract (normative for CostLease hard-kill):
# - cancel is best-effort but BOUNDED: SIGTERM → wait grace_period_seconds (default 5)
#   → SIGKILL → reap orphans. Returns cancel_acknowledged boolean.
# - Sidecar detects lease revocation and signals the sandbox process; Adapter.cancel
#   is invoked by AgentExecutor; Sidecar MUST NOT write Execution DB.
# - health() interval: implementers SHOULD poll every health_check_interval_seconds (default 30).
#
# Session continuity protocol (normative for CLI agents):
# - start() returns handle containing { session_id, native_id?, adapter_type }
# - native_id maps the control-plane session_id to the agent-native session/conversation
#   (e.g. Claude Code / Codex session file id). Adapter persists this mapping durably.
# - Between pump() invocations the agent process (or native session) is the continuity
#   store; the control plane does NOT re-send full history unless reconnecting.
# - Lost session: if pump() fails with connection_lost or health() unhealthy:
#   1. Adapter attempts reconnect using native_id within reconnect_timeout_seconds (default 30)
#   2. On reconnect: replay from last checkpoint + tool_call_stream_ref via replay_metadata
#   3. On reconnect failure: emit failed with last_failure_category=infrastructure;
#      set AgentSession.replay_status=replay_incomplete if history incomplete
# - Partial replay handling:
#   * If checkpoint is available but tool_call_stream_ref is incomplete: emit failed
#     with last_failure_category=infrastructure and replay_status=replay_incomplete.
#   * The control plane MUST NOT accept artifacts produced from partial replay without
#     explicit operator override.
# - replay_metadata full shape is required for reconstruction; invocation seed is expanded
#   at session start (see agent-invocation.schema.yaml + replay-metadata.schema.yaml)

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "amir://contract/interfaces/agent-adapter"

type: object
required: [interface, methods, process_supervision, session_continuity]
properties:
  interface:
    const: AgentAdapter

  process_supervision:
    type: object
    required: [sigterm_grace_period_seconds, sigkill_escalation]
    properties:
      sigterm_grace_period_seconds:
        type: integer
        minimum: 1
        maximum: 30
        default: 5
        description: "Max wait after SIGTERM before SIGKILL (CostLease hard-kill bound)"
      sigkill_escalation:
        type: boolean
        default: true
        description: "If true, escalate to SIGKILL after grace period"
      orphan_reap:
        type: boolean
        default: true
        description: "Reap child processes left by CLI agents after kill"
      health_check_interval_seconds:
        type: integer
        minimum: 5
        maximum: 120
        default: 30
        description: "Recommended health poll interval"

  session_continuity:
    type: object
    required: [reconnect_timeout_seconds, use_replay_metadata_on_reconnect]
    properties:
      reconnect_timeout_seconds:
        type: integer
        minimum: 1
        default: 30
      use_replay_metadata_on_reconnect:
        type: boolean
        const: true
        description: "On reconnect, reconstruct from ReplayMetadata + last checkpoint"
      native_id_required:
        type: boolean
        default: false
        description: "If true, adapter must return native_id from start() for reconnect"

  methods:
    type: array
    items:
      type: object
      required: [name, purpose, inputs, outputs]
      properties:
        name:
          type: string
          enum:
            - start
            - pump
            - respond_input
            - inject_feedback
            - cancel
            - health
        purpose:
          type: string
        inputs:
          type: array
          items:
            type: string
          description: "Method input parameters (order matters for positional args)"
        outputs:
          type: array
          items:
            type: string
          description: "Method return values (order matters for positional args)"

# Method signatures (canonical for implementers):
# start(session, compiled_prompt, sandbox) -> handle
#   handle = { session_id, native_id?, adapter_type, reconnect_token? }
# pump(handle) -> output_chunk | tool_call | needs_input | completed | failed | timed_out | connection_lost (stream)
# respond_input(handle, text) -> void
# inject_feedback(handle, feedback_artifact) -> void
# cancel(handle, cancellation_reason, grace_period_seconds?) -> { cancel_acknowledged }
#   - cancellation_reason from CostLease.cancellation_reason enum
#   - grace_period_seconds parameter OVERRIDES process_supervision.sigterm_grace_period_seconds
#   - SIGTERM then wait grace period then SIGKILL; reap orphans
#   - MUST return within grace_period_seconds + 2s (synchronous best-effort bound)
# health() -> { status }  status = healthy | degraded | unhealthy
