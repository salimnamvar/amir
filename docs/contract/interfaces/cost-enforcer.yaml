# CostEnforcer Interface Contract
# Synchronous lease check boundary for sidecar / egress / executor
#
# Trust boundary:
# - P0-COSTLEASE-RACE: Observability Context is the SOLE authority for CostLease
#   status mutations (active → revoked/expired/released). No other component may
#   write CostLease.status. Execution Context holds a read-only lease_id reference.
# - Execution holds lease_id on AgentSession (read-only projection)
# - Sidecar/egress checks lease synchronously on each metering tick (≤100ms)
# - Sidecar MUST NOT write Execution DB or CostLease; only signals process / returns check result
# - AgentExecutor transitions AgentSession on cancel/ack
# - P0-COSTLEASE-RACE: fail-closed invariant:
#   lease_authority_unreachable => execution_paused_or_cancelled
#   If CostEnforcer (Observability Context) becomes unreachable, Execution MUST
#   pause all new consumption and cancel in-flight sessions. No silent degradation.
# - P0-COSTLEASE-RACE: lease_check_revision on AgentSession must match
#   CostLease.lease_revision for any transition from running to succeeded.
#   Mismatch forces cancellation (prevents session completion between revocation and observation).

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "amir://contract/interfaces/cost-enforcer"

type: object
required: [interface, methods, invariants]
properties:
  interface:
    const: CostEnforcer

  invariants:
    type: object
    properties:
      max_tick_latency_ms:
        type: integer
        const: 100
        description: "Lease check must complete within 100ms"
      fail_closed_default:
        type: boolean
        const: true
      kill_threshold_pct_default:
        type: number
        const: 95
        description: >
          Default value only. Callers MAY override within [50, 100] per
          CostLease.kill_threshold_pct schema.
      # P0-COSTENFORCER-HEARTBEAT: stale leases auto-revoked when agent hangs
      heartbeat_timeout_seconds:
        type: integer
        minimum: 1
        maximum: 300
        default: 60
        description: >
          If no heartbeat received from the agent sidecar within this window,
          the lease is auto-revoked with cancellation_reason=heartbeat_timeout.
          Sidecar hard-kill ≤100ms after auto-revoke. Prevents indefinite lease
          retention when agent process hangs silently (compute-bound, no SIGTERM trigger).
      # P0-KILL-BOUND: total time from lease.revoked to session.cancelled must be bounded
      total_kill_latency_ms:
        type: integer
        minimum: 1000
        maximum: 10000
        default: 7000
        description: >
          Maximum total time (ms) from lease status=revoked to AgentSession.status=cancelled.
          Composed of: sidecar tick (≤100ms) + SIGTERM grace (≤5s) + SIGKILL + orphan reap
          + cancel_acknowledged return (≤grace+2s). Worst case with grace=5s: 100+5000+2000=7100ms.
          Agents consuming compute beyond this bound are a budget overrun violation.
          Implementations MUST enforce this as a hard upper bound on the kill chain.
      # P0-LEASE-REVISION-ATOMIC: lease revision check-then-act must be atomic
      lease_revision_atomicity:
        type: string
        enum: [optimistic_locking, distributed_lock, database_atomic]
        default: optimistic_locking
        description: >
          P0-LEASE-REVISION-ATOMIC: The lease_revision check-then-act pattern MUST be atomic.
          Without atomicity, concurrent requests can bypass lease limits.
          Implementations MUST use one of:
          - optimistic_locking: compare-and-swap on lease_revision
          - distributed_lock: Redis/etcd lock for lease operations
          - database_atomic: UPDATE ... WHERE revision = ? (single statement)
          Concurrent requests that detect a revision mismatch MUST retry or fail-closed.

  methods:
    type: array
    items:
      type: object
      required: [name, purpose, inputs, outputs]
      properties:
        name:
          type: string
          enum:
            - reserve_lease
            - heartbeat
            - check_lease
            - commit_lease
            - revoke_lease
            - revoke_by_scope
            - ack_revocation
        purpose:
          type: string
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string

# Canonical method semantics:
# reserve_lease(task_id, session_id, budget_pool, reserved_usd, reserved_tokens, scope, idempotency_key)
#   -> CostLease (status=active, lease_revision=0, scope required, agent_session_id set)
#   - Session leases use scope=invocation; Observability tracks parent team/tenant/org totals separately
# heartbeat(lease_id, consumed_usd, consumed_tokens) -> { status, lease_revision }
#   - If consumption ≥ kill_threshold_pct of reserved → auto-revoke (status=revoked sole signal)
# check_lease(lease_id, session_id) -> { action: continue | cancel, cancellation_reason?, status }
#   - status=revoked or service unavailable with fail_closed → action=cancel
#   - NEVER check a parallel cancelled boolean (does not exist)
# commit_lease(lease_id, final_consumed) -> { status: released }
# revoke_lease(lease_id, cancellation_reason, idempotency_key) -> { status: revoked, revocation_revision }
# revoke_by_scope(scope, scope_id, cancellation_reason, idempotency_key)
#   -> { revoked_lease_ids: uuid[], count: int }
#   - Hierarchical cascade: revokes ALL active leases attributed to team_id|tenant_id|org_id
#   - cancellation_reason MUST be team_budget_exceeded | tenant_budget_exceeded | org_budget_exceeded
#     (Implementations MUST reject other cancellation_reason values with a validation error;
#     manual_revocation and invocation_budget_exceeded are per-lease, not per-scope cascade)
#   - Each child lease gets status=revoked; sidecars hard-kill sessions ≤100ms
#   - Emits EscalationSignal (cost_limit_exceeded) for team+ scope
# ack_revocation(lease_id, session_id, ack_at) -> void
#   - Sidecar ACK within sidecar_ack_deadline_ms
