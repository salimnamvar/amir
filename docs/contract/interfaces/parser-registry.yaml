# ParserRegistry / OutputParser Interface Contract
#
# Strategy order is an ordered tuple, not a set. Strategies MUST be tried in order;
# stop at first success. workspace_observation is the final ground-truth arbiter
# in the default chain. llm_coercion is opt-in only and requires Approval at parse time.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "amir://contract/interfaces/parser-registry"

type: object
required:
  - interface
  - default_strategy_chain
  - methods
  - output_mode_to_strategy_mapping
  - strategy_failure_policy
properties:
  interface:
    const: ParserRegistry

  default_strategy_chain:
    type: array
    description: >
      Fixed ordered tuple (prefixItems). MUST be applied in this exact order; stop at first success.
      llm_coercion is NOT included. workspace_observation is always last.
      Any permutation is schema-invalid.
      P1-WORKSPACE-OBS-FALLBACK: If workspace_observation is unavailable (network, permission,
      filesystem error), the parser chain MUST fail-closed: reject the artifact with
      structural error. Do NOT silently skip workspace_observation — it is the ground-truth
      arbiter and skipping it defeats the entire observation model.
    prefixItems:
      - const: structured_output
      - const: tool_call_interception
      - const: markdown_block
      - const: workspace_observation
    items: false
    minItems: 4
    maxItems: 4
    # Canonical instance value for implementers / CI:
    # [structured_output, tool_call_interception, markdown_block, workspace_observation]

  optional_strategies:
    type: array
    items:
      type: string
      enum: [llm_coercion]
    description: >
      Opt-in only. Selecting llm_coercion requires approval_ref (Approval with status=granted
      and approval_type=coercion) at parse time (fail-closed). Produced artifacts MUST have
      observation_method=synthesized and coercion_approval_id set.
      P1-SYNC-COERCION: To avoid blocking the synchronous parse chain on human approval
      (default timeout 86400s), coercion approvals MUST be pre-granted at Task/Role
      configuration level (e.g., Role.allow_llm_coercion: true with a pre-created Approval
      entity). The parser verifies the pre-granted approval at parse time; it does not
      create a new Approval request synchronously.

  # Per-strategy and total failure handling
  strategy_failure_policy:
    type: object
    required: [strategy_timeout_seconds, max_attempts_per_strategy, total_chain_timeout_seconds]
    properties:
      strategy_timeout_seconds:
        type: integer
        minimum: 1
        default: 30
        description: "Max wall time for a single strategy attempt"
      max_attempts_per_strategy:
        type: integer
        minimum: 1
        default: 1
        description: "Retries for a single strategy before advancing to the next"
      total_chain_timeout_seconds:
        type: integer
        minimum: 1
        default: 120
        description: "Hard ceiling for the entire strategy chain"
      on_all_strategies_failed:
        type: string
        enum: [reject, escalate]
        default: reject
        description: >
          reject = ValidationResult.valid=false with structural error;
          escalate = emit EscalationSignal.
          try_llm_coercion is REMOVED (P0-COERCION-BYPASS): llm_coercion requires
          an explicit, fresh Approval with status=granted and approval_type=coercion
          at parse time — never an automatic fallback from a cached approval_ref.

  strategy_outcome:
    type: string
    enum: [success, failed, timed_out, skipped]
    description: "Per-strategy run outcome recorded in ValidationMetric / parse result"

  # Canonical mapping from agent/control-plane output_mode to ParserStrategy
  output_mode_to_strategy_mapping:
    type: object
    description: "Maps AgentInvocation/CompiledPrompt.output_mode → ParserRegistry strategy"
    required: [json_schema, tool_use, markdown_yaml, workspace_observation]
    properties:
      json_schema:
        type: string
        const: structured_output
      tool_use:
        type: string
        const: tool_call_interception
      markdown_yaml:
        type: string
        const: markdown_block
      workspace_observation:
        type: string
        const: workspace_observation

  methods:
    type: array
    items:
      type: object
      required: [name]
      properties:
        name:
          type: string
          enum:
            - get_parser
            - register_parser
            - select_strategy
            - parse
            - can_handle
        purpose:
          type: string
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string

# Canonical method semantics:
# select_strategy(agent_capabilities, output_mode) -> strategy_chain
#   - Builds ordered chain from default_strategy_chain filtered by agent support
#   - Never inserts llm_coercion unless caller provides approval_ref
# parse(raw_output, strategy_chain, workspace_snapshot, approval_ref?) ->
#   { artifact?, observation_method, parser_strategy_used, strategy_attempts[], approval_ref? }
#   strategy_attempts[]: [{ strategy, outcome: success|failed|timed_out|skipped, error_category?, duration_ms }]
#   - Failed strategy outcomes map to ValidationResult.error_categories (structural/semantic/timeout)
#   - If strategy_chain includes llm_coercion, approval_ref is REQUIRED (fail-closed)
#   - llm_coercion always sets observation_method=synthesized
# can_handle(raw_output, strategy) -> boolean
# get_parser / register_parser: registry management
