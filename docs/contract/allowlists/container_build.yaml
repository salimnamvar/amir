# Optional allowlist profile for container-build roles only
# Authority: docs/contract/allowlists/container_build.yaml
# Does NOT permit docker sandbox runtime in production — only registry network reachability.
# Assign only when role has explicit container-build capability; still subject to intersection merge.
# If role.required_network is empty, the role layer is skipped in intersection (not zeroed).

profile: container_build
version: "1.0.0"
description: >
  Network destinations for pulling base images. Not part of coding_standard.
  Production sandboxes still ban runtime=docker (sandbox.schema.yaml if/then).

hosts:
  - ghcr.io
  - registry-1.docker.io
  - quay.io

# Test vectors for CI validation of intersection merge
test_vectors:
  - name: container_build_intersect_sandbox_subset
    agent_profile: container_build
    sandbox_hosts: [ghcr.io, registry-1.docker.io]
    role_required_network: []
    expected_effective_before_platform:
      - ghcr.io
      - registry-1.docker.io
  - name: container_build_empty_intersection
    agent_profile: container_build
    sandbox_hosts: [pypi.org]
    role_required_network: []
    expected_effective_before_platform: []
  - name: container_build_role_narrows
    agent_profile: container_build
    sandbox_profile: container_build
    role_required_network: [ghcr.io]
    expected_effective_before_platform:
      - ghcr.io
