# Canonical coding_standard network allowlist profile expansion
# Authority: docs/contract/allowlists/coding_standard.yaml
# Used by SandboxPolicy profile expansion before intersection merge.
# Platform LLM routes are always unioned AFTER intersection (see sandbox-policy.schema.yaml).

profile: coding_standard
version: "1.0.0"
description: >
  Fixed expansion for coding agents: common package registries.
  LLM provider routes are injected separately by the platform (not listed here)
  so they cannot be broadened or removed by tenant profile edits.

# Hostnames expanded when network_allowlist_profile=coding_standard
hosts:
  # Python
  - pypi.org
  - files.pythonhosted.org
  # Node / JS
  - registry.npmjs.org
  - registry.yarnpkg.com
  # Go
  - proxy.golang.org
  - sum.golang.org
  # Rust
  - crates.io
  - static.crates.io
  # Java / Maven
  - repo.maven.apache.org
  - repo1.maven.org
  # Ruby
  - rubygems.org
  # Container images (ghcr only — Docker Hub excluded from default coding profile;
  # production sandboxes ban docker runtime; use container_build profile if needed)
  - ghcr.io
  # Git hosting (clone/push for durable effects)
  - github.com
  - gitlab.com

# Test vectors for CI validation of intersection merge
# Field names match allowlist-merge.schema.yaml inputs for consistency.
test_vectors:
  - name: agent_coding_intersect_sandbox_subset
    agent_profile: coding_standard
    sandbox_set: [pypi.org, github.com]
    role_set: []
    platform_llm_routes: []
    expected_effective: [pypi.org, github.com]
  - name: empty_intersection_deny_all_except_platform
    agent_profile: coding_standard
    sandbox_set: []
    role_set: []
    platform_llm_routes: [api.openai.com]
    expected_effective: [api.openai.com]
  - name: role_layer_narrows
    agent_profile: coding_standard
    sandbox_set: [pypi.org, github.com]
    role_set: [pypi.org]
    platform_llm_routes: []
    expected_effective: [pypi.org]

# Separate profile for roles that must pull base images (not default coding_standard).
# Only assignable when role has explicit container-build capability; still subject to
# intersection merge and production runtime ban on docker sandbox runtime.
